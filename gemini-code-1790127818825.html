<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄果短剧 - 网页播放器</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; background: #f0f2f5; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .search-box { display: flex; gap: 10px; }
        .search-box input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        .search-box button { padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .search-box button:hover { background: #0056b3; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        /* 注意: 由于原站图片加密，这里可能无法直接显示，显示为灰色占位 */
        .card-img { height: 260px; background: #ddd; display: flex; align-items: center; justify-content: center; color: #888; font-size: 12px; text-align: center; padding: 10px; overflow: hidden; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 12px; }
        .card-title { font-size: 14px; font-weight: bold; margin: 0 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-remarks { font-size: 12px; color: #666; }

        /* 播放器弹窗 */
        #player-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .close-btn { position: absolute; top: 20px; right: 30px; color: white; font-size: 30px; cursor: pointer; font-weight: bold; }
        #video-container { width: 80%; max-width: 900px; background: black; }
        video { width: 100%; height: auto; max-height: 70vh; }
        
        /* 选集列表 */
        .ep-list { margin-top: 20px; width: 80%; max-width: 900px; display: flex; flex-wrap: wrap; gap: 10px; max-height: 20vh; overflow-y: auto; }
        .ep-btn { padding: 8px 12px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
        .ep-btn:hover, .ep-btn.active { background: #007bff; border-color: #007bff; }
        
        #loading { display: none; text-align: center; padding: 20px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>黄果短剧 (Web解析版)</h2>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索短剧...">
            <button onclick="doSearch()">搜索</button>
        </div>
    </div>
    
    <div id="loading">正在通过代理抓取数据，请稍候...</div>
    <div class="grid" id="videoGrid"></div>
</div>

<div id="player-modal">
    <div class="close-btn" onclick="closePlayer()">&times;</div>
    <div id="video-container">
        <video id="videoPlayer" controls></video>
    </div>
    <div class="ep-list" id="epList"></div>
</div>

<script>
    const SITE = 'https://huangguoai.com';
    // 必须使用 CORS 代理，否则浏览器会拦截请求。这里使用公共免费代理演示
    const CORS_PROXY = 'https://corsproxy.io/?'; 

    let hls = null;

    // ---------- 核心解析逻辑 (移植自你的代码) ----------
    
    function stripTags(s) { return String(s || '').replace(/<[^>]*>/g, '').trim(); }
    
    async function fetchHtml(url) {
        try {
            document.getElementById('loading').style.display = 'block';
            // 将目标 URL 编码后拼接在代理服务后面
            const targetUrl = encodeURIComponent(url);
            const res = await fetch(CORS_PROXY + targetUrl);
            const text = await res.text();
            document.getElementById('loading').style.display = 'none';
            return text;
        } catch (e) {
            console.error("Fetch Error (可能代理失效或被墙):", e);
            document.getElementById('loading').innerText = '网络请求失败，可能是跨域代理失效。';
            return '';
        }
    }

    function parseGridCards(html) {
        if (!html) return [];
        const list = [];
        const seen = {};
        // 简化版正则，直接匹配卡片
        const re = /<div\s+class="[^"]*\bhg-drama-card\b[^"]*"[^>]*>([\s\S]*?)<\/div>\s*<\/div>/g;
        let m;
        while ((m = re.exec(html)) !== null) {
            const block = m[1];
            const a = block.match(/href="[^"]*\/detail\/(\d+)\/[^"]*"/);
            if (!a) continue;
            const vid = a[1];
            if (seen[vid]) continue;
            
            const imgM = block.match(/data-src="([^"]+)"/) || block.match(/src="([^"]+)"/);
            let title = '';
            const t = block.match(/hg-drama-card__title[^>]*>([\s\S]*?)<\/a>/);
            if (t) title = stripTags(t[1]);
            if (!title) continue;
            
            const ep = block.match(/hg-drama-card__episode[^>]*>([\s\S]*?)<\/span>/);
            const remarks = ep ? stripTags(ep[1]) : '';
            
            seen[vid] = true;
            list.push({
                vod_id: vid,
                vod_name: title,
                vod_pic: imgM ? imgM[1] : '', // 原图地址，网页端因为加密可能无法显示
                vod_remarks: remarks
            });
        }
        return list;
    }

    // ---------- 交互逻辑 ----------

    async function loadHome() {
        const html = await fetchHtml(SITE + '/');
        const list = parseGridCards(html);
        renderGrid(list);
    }

    async function doSearch() {
        const kw = document.getElementById('searchInput').value.trim();
        if (!kw) return loadHome();
        const html = await fetchHtml(SITE + '/search/video/' + encodeURIComponent(kw) + '/');
        const list = parseGridCards(html);
        renderGrid(list);
    }

    function renderGrid(list) {
        const grid = document.getElementById('videoGrid');
        grid.innerHTML = '';
        if(list.length === 0) {
            grid.innerHTML = '<p>未找到内容或抓取失败。</p>';
            return;
        }
        list.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            // 注意：这里放的是原始图片链接，由于对方AES加密，图片可能是花屏或加载不出来
            card.innerHTML = `
                <div class="card-img">
                    <img src="${item.vod_pic}" alt="${item.vod_name}" onerror="this.style.display='none'; this.parentNode.innerHTML='(原站图片已加密)'" />
                </div>
                <div class="card-info">
                    <h3 class="card-title" title="${item.vod_name}">${item.vod_name}</h3>
                    <div class="card-remarks">${item.vod_remarks}</div>
                </div>
            `;
            card.onclick = () => openDetail(item.vod_id);
            grid.appendChild(card);
        });
    }

    // ---------- 播放逻辑 ----------

    async function openDetail(id) {
        document.getElementById('loading').style.display = 'block';
        const html = await fetchHtml(SITE + '/detail/' + id + '/');
        const tracks = [];
        
        // 解析选集
        const gridM = html.match(/<div\s+class="[^"]*\bhg-web-detail__ep-grid\b[^"]*"[^>]*>([\s\S]*?)<\/div>/);
        if (gridM) {
            const are = /<a\b[^>]*>[\s\S]*?<\/a>/g;
            let m;
            while ((m = are.exec(gridM[1])) !== null) {
                const tag = m[0];
                const hrefM = tag.match(/href="([^"]+)"/);
                if (!hrefM) continue;
                const eidM = tag.match(/data-ep-id="([^"]*)"/);
                const name = eidM ? '第' + eidM[1] + '集' : stripTags(tag);
                tracks.push({ name: name, url: SITE + hrefM[1], ep: eidM ? eidM[1] : '1' });
            }
        }
        
        document.getElementById('loading').style.display = 'none';
        
        if (tracks.length > 0) {
            showPlayer(tracks);
            playEpisode(tracks[0].url, tracks[0].ep, 0); // 默认播放第一集
        } else {
            alert('未解析到播放列表');
        }
    }

    function showPlayer(tracks) {
        const modal = document.getElementById('player-modal');
        const epList = document.getElementById('epList');
        epList.innerHTML = '';
        
        tracks.forEach((track, index) => {
            const btn = document.createElement('button');
            btn.className = 'ep-btn';
            btn.id = 'ep-btn-' + index;
            btn.innerText = track.name;
            btn.onclick = () => playEpisode(track.url, track.ep, index);
            epList.appendChild(btn);
        });
        
        modal.style.display = 'flex';
    }

    async function playEpisode(pageUrl, ep, index) {
        // 更新选集 UI 状态
        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('ep-btn-' + index).classList.add('active');

        // 解析真实 m3u8 地址
        const html = await fetchHtml(pageUrl);
        let playUrl = '';
        const m = html.match(/id="videoInitialData"[^>]*>([\s\S]*?)<\/script>/);
        if (m) {
            try {
                const data = JSON.parse(m[1]);
                const srcs = data.epPlaySrcs || {};
                playUrl = srcs[ep] || data.videoSrc || '';
                playUrl = playUrl.replace(/\\u0026/g, '&');
            } catch (e) {}
        }

        if (!playUrl) {
            alert('获取视频源失败');
            return;
        }

        // 调用播放器
        initHlsPlayer(playUrl);
    }

    function initHlsPlayer(url) {
        const video = document.getElementById('videoPlayer');
        if (hls) {
            hls.destroy();
        }
        
        if (Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Safari 原生支持
            video.src = url;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    }

    function closePlayer() {
        document.getElementById('player-modal').style.display = 'none';
        const video = document.getElementById('videoPlayer');
        video.pause();
        if (hls) {
            hls.destroy();
            hls = null;
        }
    }

    // 初始化加载首页
    window.onload = loadHome;

</script>
</body>
</html>
