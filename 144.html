<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>黄果短剧聚合 Web 播放器</title>
  <!-- HLS 播放器核心支持 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-main: #0c0e14;
      --bg-card: #151821;
      --bg-card-hover: #1c212d;
      --primary: #e50914;
      --primary-hover: #f40612;
      --text-main: #ffffff;
      --text-sub: #8e95a5;
      --border-color: #232736;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* 顶部搜索框 */
    .search-box {
      display: flex;
      align-items: center;
      background: #171b26;
      border: 1px solid var(--border-color);
      border-radius: 30px;
      padding: 4px 6px 4px 18px;
      transition: border-color 0.2s;
    }
    .search-box:focus-within { border-color: var(--primary); }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
    }
    .search-box input::placeholder { color: #565d70; }
    .search-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      outline: none;
      padding: 9px 24px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .search-btn:hover { background: var(--primary-hover); }

    /* 导航标签 */
    .tabs-nav {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .tabs-nav::-webkit-scrollbar { display: none; }
    .tab-item {
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-sub);
      background: transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .tab-item.active {
      background: var(--primary);
      color: #fff;
    }

    /* 线路控制条 */
    .route-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #12151d;
      border: 1px solid #1f2330;
      border-radius: 8px;
      font-size: 13px;
    }
    .route-title { color: #f59e0b; display: flex; align-items: center; gap: 4px; }
    .route-btn {
      background: #1c212e;
      border: 1px solid var(--border-color);
      color: #cbd5e1;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .route-btn:hover { border-color: var(--primary); color: #fff; }
    .route-btn.active {
      background: rgba(229, 9, 20, 0.15);
      border-color: var(--primary);
      color: #ff6b6b;
      font-weight: 600;
    }

    /* 诊断面板 (错误提示) */
    .status-panel {
      background: rgba(21, 24, 33, 0.85);
      border: 1px solid #2a3042;
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
    }
    .status-panel.error .title { color: #f87171; font-size: 18px; margin-bottom: 8px; }
    .status-panel.loading .title { color: #60a5fa; font-size: 16px; }
    .status-desc { font-size: 13px; color: var(--text-sub); margin-bottom: 16px; }
    
    .diag-box {
      text-align: left;
      background: #090a0f;
      border: 1px solid #1c202d;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #94a3b8;
      max-height: 200px;
      overflow-y: auto;
      line-height: 1.5;
    }
    .diag-line { margin-bottom: 4px; word-break: break-all; }
    .diag-val { color: #e2e8f0; }

    /* 视频网格 */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      width: 100%;
    }
    @media (max-width: 600px) {
      .video-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    }
    @media (max-width: 420px) {
      .video-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .video-card {
      background: var(--bg-card);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid transparent;
    }
    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      border-color: #2b3245;
    }
    .cover-wrap {
      position: relative;
      width: 100%;
      padding-top: 140%; /* 竖屏短剧比例 */
      background: #1c212e;
      overflow: hidden;
    }
    .cover-wrap img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .badge {
      position: absolute;
      right: 6px;
      bottom: 6px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      color: #f1f5f9;
    }
    .info {
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .info .name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f1f5f9;
    }

    /* 播放弹窗 */
    .player-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .player-modal.show { display: flex; }
    .player-container {
      width: 100%;
      max-width: 480px;
      background: #141721;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }
    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }
    .player-title { 
      font-size: 14px; 
      font-weight: 600; 
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 80%;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
    }
    .video-viewport {
      width: 100%;
      aspect-ratio: 9/16;
      background: #000;
      max-height: 70vh;
      position: relative;
    }
    video { width: 100%; height: 100%; }
    .player-tip {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #94a3b8;
      font-size: 13px;
      pointer-events: none;
    }

    /* 页脚 */
    footer {
      margin-top: 36px;
      margin-bottom: 16px;
      font-size: 12px;
      color: #4b5563;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 搜索栏 -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索短剧、漫剧、类型关键词" onkeydown="if(event.key==='Enter') handleSearch()" />
    <button class="search-btn" onclick="handleSearch()">搜索</button>
  </div>

  <!-- 分类导航栏（已修复为黄果站点真实拼音规范路径） -->
  <div class="tabs-nav" id="tabsNav">
    <div class="tab-item active" onclick="switchCategory('', this)">首页推荐</div>
    <div class="tab-item" onclick="switchCategory('ai-duanju', this)">AI短剧</div>
    <div class="tab-item" onclick="switchCategory('ai-manju', this)">AI漫剧</div>
    <div class="tab-item" onclick="switchCategory('ai-huanlian', this)">AI换脸</div>
    <div class="tab-item" onclick="switchCategory('ai-mogai', this)">AI魔改</div>
    <div class="tab-item" onclick="switchCategory('rank', this)">排行榜</div>
  </div>

  <!-- 线路调度切换区 -->
  <div class="route-bar">
    <span class="route-title">⚡ 节点线路：</span>
    <button class="route-btn" onclick="selectRoute(0)">线路01 (dlvd 推荐)</button>
    <button class="route-btn" onclick="selectRoute(1)">线路02 (vzb1e 稳定)</button>
    <button class="route-btn" onclick="selectRoute(2)">线路03 (ufepzk 备用)</button>
    <button class="route-btn" onclick="selectRoute(3)">主站 (huangguo10)</button>
    <button class="route-btn" onclick="selectRoute(4)">线路 ni6b</button>
  </div>

  <!-- 诊断与状态面板 -->
  <div id="statusPanel" class="status-panel loading" style="display: none;">
    <div class="title" id="statusTitle">加载中...</div>
    <div class="status-desc" id="statusDesc">正在连接短剧资源节点</div>
    <div class="diag-box" id="diagBox" style="display: none;"></div>
  </div>

  <!-- 视频列表瀑布流 -->
  <div class="video-grid" id="videoGrid"></div>
</div>

<!-- 视频播放弹窗 -->
<div class="player-modal" id="playerModal">
  <div class="player-container">
    <div class="player-header">
      <div class="player-title" id="playTitle">短剧播放</div>
      <button class="close-btn" onclick="closePlayer()">✕</button>
    </div>
    <div class="video-viewport">
      <div class="player-tip" id="playerTip" style="display: none;">正在解析播放流...</div>
      <video id="mainVideo" controls playsinline></video>
    </div>
  </div>
</div>

<footer>黄果短剧聚合 Web 播放器</footer>

<script>
  // 线路节点池
  const ROUTES = [
    { name: "线路01 (dlvd)", url: "https://dlvd.xxpofweu.cc" },
    { name: "线路02 (vzb1e)", url: "https://vzb1e.xxpofweu.cc" },
    { name: "线路03 (ufepzk)", url: "https://ufepzk.xxpofweu.cc" },
    { name: "主站 (huangguo10)", url: "https://huangguo10.com" },
    { name: "线路 ni6b", url: "https://ni6b.xxpofweu.cc" }
  ];

  // 跨域代理服务池（自动故障转移）
  const PROXIES = [
    "https://hg-img.bobox.de5.net/?url=",
    "https://api.allorigins.win/raw?url="
  ];

  let currentRouteIdx = 0;
  let currentCategory = "";
  let hlsInstance = null;

  window.addEventListener("DOMContentLoaded", () => {
    updateRouteBtnUI();
    fetchDramaList();
  });

  function updateRouteBtnUI() {
    const buttons = document.querySelectorAll(".route-bar .route-btn");
    buttons.forEach((btn, idx) => {
      btn.classList.toggle("active", idx === currentRouteIdx);
    });
  }

  function selectRoute(index) {
    currentRouteIdx = index;
    updateRouteBtnUI();
    fetchDramaList();
  }

  function switchCategory(cat, el) {
    document.querySelectorAll(".tab-item").forEach(item => item.classList.remove("active"));
    el.classList.add("active");
    currentCategory = cat;
    fetchDramaList();
  }

  function handleSearch() {
    const query = document.getElementById("searchInput").value.trim();
    if (!query) return;
    fetchDramaList(query);
  }

  // 核心带自动降级的请求处理器
  async function fetchWithFallback(targetUrl) {
    let lastError = null;
    for (let i = 0; i < PROXIES.length; i++) {
      const proxy = PROXIES[i];
      const fullUrl = proxy + encodeURIComponent(targetUrl);
      try {
        const resp = await fetch(fullUrl, { method: "GET" });
        if (!resp.ok) throw new Error(`HTTP 状态码: ${resp.status}`);
        const text = await resp.text();
        if (text && text.trim().length > 0) {
          return { text, proxyUsed: proxy };
        }
      } catch (err) {
        lastError = err;
      }
    }
    throw lastError || new Error("所有代理通道均未能成功获取数据");
  }

  // 构建准确的目标节点 URL
  function buildTargetUrl(searchKeyword = "") {
    const base = ROUTES[currentRouteIdx].url.replace(/\/+$/, '');
    if (searchKeyword) {
      return `${base}/search?wd=${encodeURIComponent(searchKeyword)}`;
    }
    if (currentCategory) {
      const cleanCat = currentCategory.replace(/^\/+|\/+$/g, '');
      // 黄果 CMS 规范：分类直达 /{category}/
      return `${base}/${cleanCat}/`;
    }
    return `${base}/`;
  }

  // 核心拉取与解析调度逻辑
  async function fetchDramaList(searchKeyword = "") {
    const statusPanel = document.getElementById("statusPanel");
    const statusTitle = document.getElementById("statusTitle");
    const statusDesc = document.getElementById("statusDesc");
    const diagBox = document.getElementById("diagBox");
    const videoGrid = document.getElementById("videoGrid");

    videoGrid.innerHTML = "";
    statusPanel.style.display = "block";
    statusPanel.className = "status-panel loading";
    statusTitle.innerText = "数据获取中...";

    const targetUrl = buildTargetUrl(searchKeyword);
    statusDesc.innerText = `正在请求节点：${targetUrl}`;
    diagBox.style.display = "none";

    try {
      const { text: rawText, proxyUsed } = await fetchWithFallback(targetUrl);

      // 检测是否命中了 Cloudflare/WAF 混淆盾
      const isAntiBot = rawText.includes("atob") && rawText.includes("location");
      const listData = parseHTML(rawText, targetUrl);

      if (listData && listData.length > 0) {
        statusPanel.style.display = "none";
        renderVideos(listData);
      } else {
        throw new Error(isAntiBot 
          ? "目标节点开启了防爬/WAF 重定向盾 (包含 atob 混淆脚本)" 
          : "已成功请求页面，但未匹配到剧集卡片元素（分类路径下无数据或 DOM 结构变更）"
        );
      }
    } catch (err) {
      statusPanel.className = "status-panel error";
      statusTitle.innerText = "❌ 无法获取视频列表";
      statusDesc.innerText = err.message;
      
      diagBox.style.display = "block";
      diagBox.innerHTML = `
        <div class="diag-line">🔍 <strong>实时网络诊断日志:</strong></div>
        <div class="diag-line">目标地址: <span class="diag-val">${targetUrl}</span></div>
        <div class="diag-line">当前节点: <span class="diag-val">${ROUTES[currentRouteIdx].name}</span></div>
        <div class="diag-line">故障原因: <span class="diag-val" style="color:#ef4444">${err.message}</span></div>
        <div class="diag-line">建议方案: 尝试点击切换上方其它线路（如线路01或02），或检查网络环境。</div>
      `;
    }
  }

  // 增强型 HTML 解析器
  function parseHTML(htmlString, baseUrl) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(htmlString, "text/html");
    const results = [];

    // 适配黄果及 MacCMS 各类变体模板选择器
    const cardSelectors = [
      ".module-item",
      ".vodlist_item",
      ".hl-list-item",
      ".stui-vodlist__item",
      ".video-item",
      ".public-list-box",
      ".drama-item",
      ".anthology-list-item",
      "a[href*='/detail/']",
      "a[href*='/voddetail/']"
    ];

    let items = [];
    for (const sel of cardSelectors) {
      const matched = doc.querySelectorAll(sel);
      if (matched && matched.length > 0) {
        items = Array.from(matched);
        break;
      }
    }

    if (items.length > 0) {
      items.forEach(el => {
        const linkEl = el.tagName.toLowerCase() === "a" ? el : el.querySelector("a");
        const titleEl = el.querySelector(".title, .module-item-title, .name, h4, h3") || linkEl;
        const imgEl = el.querySelector("img");
        const tagEl = el.querySelector(".module-item-text, .pic-text, .remarks, .tag, .public-list-prb");

        const rawHref = linkEl ? linkEl.getAttribute("href") : "";
        const title = titleEl ? (titleEl.getAttribute("title") || titleEl.innerText).trim() : "短剧集";
        
        // 封面提取：兼顾各种懒加载属性与 style 背景图
        let cover = "";
        if (imgEl) {
          cover = imgEl.getAttribute("data-original") || 
                  imgEl.getAttribute("data-src") || 
                  imgEl.getAttribute("src") || "";
        }
        if (!cover) {
          const bgDiv = el.querySelector("[style*='background-image']");
          if (bgDiv) {
            const bgMatch = bgDiv.getAttribute("style").match(/url\(['"]?(.*?)['"]?\)/);
            if (bgMatch) cover = bgMatch[1];
          }
        }

        if (cover && !cover.startsWith("http")) {
          try {
            cover = new URL(cover, baseUrl).href;
          } catch(e) {}
        }

        if (title && rawHref) {
          let resolvedUrl = rawHref;
          try {
            resolvedUrl = new URL(rawHref, baseUrl).href;
          } catch(e) {}

          results.push({
            title: title.replace(/\s+/g, ' '),
            cover: cover || "https://images.unsplash.com/photo-1594909122845-11baa439b7bf?w=400",
            tag: tagEl ? tagEl.innerText.trim() : "更新中",
            url: resolvedUrl
          });
        }
      });
    }

    // 兜底脚本变量 JSON 解析
    if (results.length === 0) {
      const scripts = doc.querySelectorAll("script");
      scripts.forEach(sc => {
        const content = sc.innerText;
        const jsonMatch = content.match(/var\s+(?:vod_list|list_data|page_data)\s*=\s*(\[.*?\]);/s);
        if (jsonMatch) {
          try {
            const parsed = JSON.parse(jsonMatch[1]);
            parsed.forEach(item => {
              results.push({
                title: item.vod_name || item.title || "短剧集",
                cover: item.vod_pic || item.cover,
                tag: item.vod_remarks || "全集",
                url: `${baseUrl.replace(/\/+$/, '')}/play/${item.vod_id || ''}`
              });
            });
          } catch(e) {}
        }
      });
    }

    return results;
  }

  // 渲染短剧网格
  function renderVideos(list) {
    const container = document.getElementById("videoGrid");
    container.innerHTML = "";

    list.forEach(item => {
      const card = document.createElement("div");
      card.className = "video-card";
      card.onclick = () => openPlayer(item);
      card.innerHTML = `
        <div class="cover-wrap">
          <img src="${item.cover}" loading="lazy" alt="${item.title}" onerror="this.src='https://images.unsplash.com/photo-1594909122845-11baa439b7bf?w=400'">
          <span class="badge">${item.tag}</span>
        </div>
        <div class="info">
          <div class="name" title="${item.title}">${item.title}</div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // 播放器弹窗及视频流解析调度
  async function openPlayer(item) {
    const modal = document.getElementById("playerModal");
    const video = document.getElementById("mainVideo");
    const tip = document.getElementById("playerTip");
    document.getElementById("playTitle").innerText = item.title;
    modal.classList.add("show");

    tip.style.display = "block";
    tip.innerText = "正在解析短剧流...";

    // 优先尝试从详情页抓取真实的 m3u8 地址，失败则降级到测试流
    let playStreamUrl = "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";

    if (item.url && item.url.startsWith("http")) {
      try {
        const { text: detailHtml } = await fetchWithFallback(item.url);
        // 尝试匹配 player_aaaa 配置或通用 m3u8 正则
        const playerMatch = detailHtml.match(/player_aaaa\s*=\s*({.*?});?/s);
        if (playerMatch) {
          const cfg = JSON.parse(playerMatch[1]);
          if (cfg.url && cfg.url.includes(".m3u8")) {
            playStreamUrl = cfg.url;
          }
        } else {
          const m3u8Match = detailHtml.match(/https?:\/\/[^"'\s<>]+\.m3u8[^"'\s<>]*/);
          if (m3u8Match) {
            playStreamUrl = m3u8Match[0];
          }
        }
      } catch (e) {
        console.warn("未能解析到实时直链，采用备用播放流", e);
      }
    }

    tip.style.display = "none";

    // 挂载播放
    if (Hls.isSupported()) {
      if (hlsInstance) hlsInstance.destroy();
      hlsInstance = new Hls({ enableWorker: true });
      hlsInstance.loadSource(playStreamUrl);
      hlsInstance.attachMedia(video);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(() => {});
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = playStreamUrl;
      video.play().catch(() => {});
    }
  }

  function closePlayer() {
    const modal = document.getElementById("playerModal");
    const video = document.getElementById("mainVideo");
    modal.classList.remove("show");
    video.pause();
    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }
  }
</script>
</body>
</html>
