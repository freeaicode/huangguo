<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>黄果短剧 · 封面修正版</title>
<script defer src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f1f3f6;color:#222;font:14px system-ui,-apple-system,sans-serif}.wrap{max-width:1200px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1{font-size:21px}.search{display:flex;gap:6px}.search input{min-width:0;padding:9px;border:1px solid #ddd;border-radius:6px}.search button,.tag.active,.ep.active{background:#1677ff;color:white}button{cursor:pointer;border:0;border-radius:6px;padding:9px}.tags{display:flex;gap:7px;overflow-x:auto;background:white;padding:10px;border-radius:8px;margin-bottom:12px}.tag{white-space:nowrap;background:#e9edf3}.status{min-height:26px;color:#666}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.card{border:0;background:white;box-shadow:0 1px 7px #0001;text-align:left;padding:0;overflow:hidden;border-radius:8px;color:inherit;width:100%}.cover{width:100%;aspect-ratio:3/4;background:linear-gradient(135deg,#193871,#537ab9);position:relative;display:grid;place-items:center}.cover img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.fallback{color:#fff;padding:15px;text-align:center;overflow-wrap:anywhere}.info{padding:8px}.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.remarks{color:#777;font-size:12px;margin-top:5px}.modal{position:fixed;inset:0;background:#090909f5;color:#fff;z-index:10;overflow:auto;padding:45px 12px 20px}.modal[hidden]{display:none}.close{position:fixed;right:12px;top:8px;font-size:22px;color:white;background:#444}.panel{max-width:900px;margin:auto}video{width:100%;max-height:65vh;background:#000}.episodes{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.ep{background:#333;color:white}.tip{color:#aaa;overflow-wrap:anywhere}@media(max-width:650px){.head{display:block}.search{margin-bottom:12px}.search input{flex:1}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap"><div class="head"><h1>黄果短剧</h1><form class="search" id="searchForm"><input id="keyword" placeholder="搜索短剧" aria-label="搜索短剧"><button>搜索</button></form></div><nav class="tags" id="tags"></nav><div class="status" id="status"></div><main class="grid" id="grid"></main></div>
<div class="modal" id="modal" hidden><button class="close" id="close" aria-label="关闭">×</button><div class="panel"><video id="video" controls playsinline></video><p class="tip" id="playStatus">选择剧集播放</p><div class="episodes" id="episodes"></div></div></div>
<script>
const SITE='https://huangguoai.com';
// 已配置你提供的 Worker 地址。它须已部署为支持 GET /image?url=... 的图片代理；无需用 <script src> 加载 Worker JS。
const IMAGE_PROXY='https://aijs.onbox.de5.net';
const state={nav:new Map(),hls:null,seq:0,detailSeq:0,playSeq:0};
const $=s=>document.querySelector(s);
const categories=['首页','排行榜','AI成人短剧','AI成人漫剧','AI换脸','AI魔改','逆袭','战神','重生','甜宠','霸总'];
function status(s){$('#status').textContent=s}
function safeUrl(value,base=SITE+'/'){
  if(typeof value!=='string'||!value.trim()||/^\s*(?:data:|blob:|javascript:)/i.test(value))return '';
  try{const u=new URL(value.replace(/&amp;/gi,'&').trim(),base);return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}
}
function proxyImage(url){return IMAGE_PROXY?IMAGE_PROXY.replace(/\/$/,'')+'/image?url='+encodeURIComponent(url):url}
function parseSrcset(s){if(!s)return '';const entries=s.split(/,(?=\s*(?:https?:\/\/|\/|[^\s,]+\.(?:jpg|jpeg|png|webp|avif)))/i);return entries.map(v=>v.trim().split(/\s+/)[0]).filter(Boolean).at(-1)||''}
function unwrapImage(s,base){
  let u=safeUrl(s,base);if(!u)return '';
  try{const x=new URL(u);const nested=x.searchParams.get('url')||x.searchParams.get('u');if(nested&&/(?:^|\.)((?:wsrv\.nl)|(?:duckduckgo\.com)|(?:googleusercontent\.com)|(?:allorigins\.win)|(?:corsproxy\.io))$/i.test(x.hostname)){u=safeUrl(nested,base)||u}}catch{}
  return u
}
function pickImage(el,base){
  if(!el)return '';
  for(const node of [el,...el.querySelectorAll('img,source,[data-src],[data-original],[style*="background"]')]){
    for(const key of ['data-src','data-original','data-lazy-src','data-echo','data-srcset','srcset','src']){
      const raw=node.getAttribute(key);if(!raw)continue;
      const u=unwrapImage(key.includes('srcset')?parseSrcset(raw):raw,base);
      if(u&&!/\.(?:svg)(?:\?|$)/i.test(u))return u
    }
    const style=node.getAttribute('style')||'';const match=style.match(/background(?:-image)?\s*:[^;]*url\(\s*['"]?([^'"\)]+)['"]?\s*\)/i);
    if(match){const u=unwrapImage(match[1],base);if(u)return u}
  }
  return ''
}
function findCover(obj,base,depth=0){
  if(!obj||typeof obj!=='object'||depth>3)return '';
  const keys=['vod_pic','cover','coverUrl','cover_url','poster','posterUrl','pic','image','imageUrl','thumbnail','thumb','vodPic'];
  for(const k of keys){if(typeof obj[k]==='string'){const u=unwrapImage(obj[k],base);if(u)return u}}
  for(const v of Object.values(obj)){if(v&&!Array.isArray(v)&&typeof v==='object'){const u=findCover(v,base,depth+1);if(u)return u}}
  return ''
}
function fromNext(doc,base){
  const script=doc.getElementById('__NEXT_DATA__');if(!script)return [];
  try{
    const root=JSON.parse(script.textContent),lists=[];
    const walk=(v,d)=>{if(d>12||!v||typeof v!=='object')return;if(Array.isArray(v)){if(v.some(x=>x&&typeof x==='object'&&(x.vod_id||x.id||x.dramaId)&&(x.vod_name||x.title||x.name)))lists.push(v);else v.forEach(x=>walk(x,d+1))}else Object.values(v).forEach(x=>walk(x,d+1))};
    walk(root.props?.pageProps||root,0);
    return lists.flat().filter(x=>x&&typeof x==='object'&&(x.vod_id||x.id||x.dramaId)).map(x=>({id:String(x.vod_id||x.id||x.dramaId),name:String(x.vod_name||x.title||x.name||'短剧'),pic:findCover(x,base),remarks:String(x.vod_remarks||x.remarks||'')}))
  }catch{return []}
}
function fromDom(doc,base){
  const result=[];
  for(const a of doc.querySelectorAll('a[href*="/detail/"]')){
    const link=safeUrl(a.getAttribute('href'),base);if(!link)continue;
    const m=new URL(link).pathname.match(/\/detail\/([^/]+)/);if(!m)continue;
    const container=a.querySelector('img')?a:(a.closest('article,li,[class*="card"],[class*="item"]')||a);
    const img=container.querySelector('img');
    const title=container.querySelector('h2,h3,h4,[class*="title"]')?.textContent?.trim()||a.getAttribute('title')||img?.getAttribute('alt')||a.textContent.trim()||'短剧 '+m[1];
    result.push({id:m[1],name:title.replace(/\s+/g,' ').slice(0,80),pic:pickImage(container,base),remarks:''})
  }
  return result
}
function parseShows(html,base){
  const doc=new DOMParser().parseFromString(html,'text/html');const next=fromNext(doc,base),dom=fromDom(doc,base),out=new Map();
  for(const x of [...dom,...next]){
    const prev=out.get(x.id);if(prev)out.set(x.id,{...prev,...x,pic:x.pic||prev.pic,name:x.name||prev.name});else out.set(x.id,x)
  }
  return {shows:[...out.values()],doc}
}
async function getHtml(url){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);
  try{const r=await fetch(url,{signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.text()}finally{clearTimeout(timer)}
}
function renderTags(active){
  $('#tags').replaceChildren();for(const name of categories){const b=document.createElement('button');b.className='tag'+(name===active?' active':'');b.textContent=name;b.onclick=()=>load(name);$('#tags').append(b)}
}
function coverBox(item){
  const div=document.createElement('div');div.className='cover';const fallback=document.createElement('div');fallback.className='fallback';fallback.textContent='🎬\n'+item.name;div.append(fallback);
  if(item.pic){const img=new Image();img.alt=item.name;img.loading='lazy';img.referrerPolicy='no-referrer';img.onload=()=>fallback.remove();img.onerror=()=>{img.remove();div.title='封面加载失败：'+item.pic};img.src=proxyImage(item.pic);div.append(img)}return div
}
function render(items){
  const grid=$('#grid');grid.replaceChildren();
  for(const item of items){const card=document.createElement('button');card.className='card';card.append(coverBox(item));const info=document.createElement('div');info.className='info';const title=document.createElement('div');title.className='title';title.textContent=item.name;const remarks=document.createElement('div');remarks.className='remarks';remarks.textContent=item.remarks||'短剧';info.append(title,remarks);card.append(info);card.onclick=()=>openDetail(item.id);grid.append(card)}
}
async function load(name='首页',search=''){
  const seq=++state.seq;renderTags(name);$('#grid').replaceChildren();status('正在加载…');
  const endpoint=search?'search/video/'+encodeURIComponent(search)+'/':name==='首页'?'':null;
  let url=endpoint!==null?SITE+'/'+endpoint:state.nav.get(name)||SITE+'/search/video/'+encodeURIComponent(name)+'/';
  try{
    const html=await getHtml(url);if(seq!==state.seq)return;
    const {shows,doc}=parseShows(html,url);
    if(name==='首页')for(const a of doc.querySelectorAll('a[href]')){const label=a.textContent.trim(),href=safeUrl(a.getAttribute('href'),url);if(categories.includes(label)&&href&&new URL(href).origin===SITE)state.nav.set(label,href)}
    render(shows);status(shows.length?'共 '+shows.length+' 部；封面失败可在 Network 中查看 /image 请求状态。':'未找到短剧，可能是站点结构变化。')
  }catch(e){if(seq===state.seq)status('读取页面失败：'+e.message+'。若控制台提示 CORS，需要同源后端代理；单靠图片代理无法解决列表请求。')}
}
async function openDetail(id){
  const seq=++state.detailSeq;status('正在读取剧集…');
  try{
    const url=SITE+'/detail/'+encodeURIComponent(id)+'/';const html=await getHtml(url);if(seq!==state.detailSeq)return;
    const doc=new DOMParser().parseFromString(html,'text/html');const tracks=[...doc.querySelectorAll('.hg-web-detail__ep-grid a[href]')].map((a,i)=>({name:a.textContent.trim()||'第'+(i+1)+'集',ep:a.getAttribute('data-ep-id')||String(i+1),page:safeUrl(a.getAttribute('href'),url)})).filter(x=>x.page);
    if(!tracks.length){status('没有解析到剧集；需检查详情页选择器。');return}
    $('#modal').hidden=false;$('#episodes').replaceChildren();tracks.forEach((t,i)=>{const b=document.createElement('button');b.className='ep';b.textContent=t.name;b.onclick=()=>playEpisode(t,b);$('#episodes').append(b)});status('已读取 '+tracks.length+' 集');$('#episodes button').click()
  }catch(e){if(seq===state.detailSeq)status('详情页失败：'+e.message)}
}
async function playEpisode(track,button){
  const seq=++state.playSeq;stopVideo();document.querySelectorAll('.ep').forEach(x=>x.classList.remove('active'));button.classList.add('active');$('#playStatus').textContent='正在解析 '+track.name+'…';
  try{
    const html=await getHtml(track.page);if(seq!==state.playSeq)return;
    const doc=new DOMParser().parseFromString(html,'text/html');const data=doc.getElementById('videoInitialData');if(!data)throw Error('没有 videoInitialData');
    const obj=JSON.parse(data.textContent),raw=obj.epPlaySrcs?.[track.ep]||obj.videoSrc||'';const url=safeUrl(raw,track.page);if(!url)throw Error('没有有效的播放 URL');
    const video=$('#video');if(/\.m3u8(?:\?|#|$)/i.test(url)){
      if(window.Hls?.isSupported()){state.hls=new Hls();state.hls.on(Hls.Events.ERROR,(_,e)=>{if(e.fatal)$('#playStatus').textContent='HLS 错误：'+e.details});state.hls.loadSource(url);state.hls.attachMedia(video)}
      else if(video.canPlayType('application/vnd.apple.mpegurl'))video.src=url;
      else throw Error('此浏览器不支持 HLS')
    }else video.src=url;
    $('#playStatus').textContent='播放：'+track.name+'（若黑屏请检查视频源的 CORS/权限）';video.play().catch(()=>{$('#playStatus').textContent+='；请点击播放键'})
  }catch(e){if(seq===state.playSeq)$('#playStatus').textContent='播放失败：'+e.message}
}
function stopVideo(){state.hls?.destroy();state.hls=null;const v=$('#video');v.pause();v.removeAttribute('src');v.load()}
$('#close').onclick=()=>{++state.playSeq;++state.detailSeq;$('#modal').hidden=true;stopVideo()};
$('#searchForm').onsubmit=e=>{e.preventDefault();const kw=$('#keyword').value.trim();load(kw?'搜索':'首页',kw)};
load();
</script>
</body>
</html>
