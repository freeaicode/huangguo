x solid #555;border-radius:15px;font-size:11px}.player.webfull{position:fixed;inset:0;top:0;z-index:9999;width:100vw;height:100dvh}.player.webfull video,.player.webfull iframe{height:100%!important;max-height:none!important}.debug{padding:8px 12px;overflow:hidden;color:var(--muted);background:#141722;font-size:12px;white-space:nowrap;text-overflow:ellipsis}.routes,.tagrow{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--card)}.routes small,.taglabel{font-size:11px;color:var(--dim);white-space:nowrap}.route{padding:4px 10px;border-radius:12px;font-size:11px}.tagrow{overflow:auto;background:#12141c;border-top:1px solid rgba(255,255,255,.04)}.tag{padding:3px 9px;white-space:nowrap;color:#d7dce5;background:#1c2130;border:1px solid #343b4d;border-radius:12px;font-size:11px}.tag b{color:var(--pink)}.detail{padding:12px}.detail h1{margin:0 0 10px;font-size:16px}.actions2{display:flex;gap:10px;margin-bottom:12px}.actions2 button{flex:1;padding:9px;color:#fff;background:var(--card);border:1px solid var(--line);border-radius:6px}.episodes button{min-width:46px;height:38px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:6px}.episodes button.active{color:#fff;background:var(--pink);border-color:var(--pink)}.section{margin-top:8px;padding:14px 12px;background:var(--card)}.section h3{margin:0 0 12px;font-size:15px}.rec{display:flex;gap:10px;margin-bottom:10px;padding:9px;background:var(--card2);border-radius:7px;cursor:pointer}.rec img{width:75px;height:100px;background:#2a3040;border-radius:5px;object-fit:cover}.rec p{margin:7px 0 0;color:var(--dim);font-size:11px}.modal{position:fixed;z-index:10001;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.75)}.modal.show{display:flex}.box{width:100%;max-width:410px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:10px}.box h3{margin:0 0 12px}.box label{display:block;color:var(--muted);font-size:12 <section id="home" class="view active"><header class="header"><div class="top"><div class="brand" onclick="switchTab('home')"><b>黄果</b> 短剧聚合</div><div><button class="icon" onclick="mock()">◫</button> <button class="icon" onclick="auth()">⚙</button></div></div><div class="search">⌕<input id="search" placeholder="搜索短剧、漫剧、类型关键词" onkeydown="if(event.key==='Enter')searchNow()"><button onclick="searchNow()">搜索</button></div><div class="tabs"><button class="tab active" data-x="home" onclick="switchTab('home')">首页推荐</button><button class="tab" data-x="ai-duanju" onclick="switchTab('ai-duanju')">AI短剧</button><button class="tab" data-x="ai-manju" onclick="switchTab('ai-manju')">AI漫剧</button><button class="tab" data-x="ai-huanlian" onclick="switchTab('ai-huanlian')">AI换脸</button><button class="tab" data-x="ai-mogai" onclick="switchTab('ai-mogai')">AI魔改</button><button class="tab" data-x="ranks/hot" onclick="switchTab('ranks/hot')">排行榜</button></div></header><main><div id="list"></div><div id="pages" class="pagination" style="display:none"></div><div class="footer">黄果短剧聚合 Web 播放器</div></main></section>

<div id="setting" class="modal"><div class="box"><h3>网络代理与解析配置</h3><label>代理 URL 前缀</label><input id="proxy"><label>目标站域名</label><input id="site"><label>公共解析接口</label><input id="parser"><label>修改管理密码（留空不修改）</label><input id="newpwd" type="password"><div class="buttons"><button onclick="close('setting')">关闭</button><button class="save" onclick="save()">保存并生效</button></div></div></div>
<script>
const VERSION='1.41',DEF_SITE='https://huangguoai.com',DEF_PROXY='https://hg-img.bobox.de5.net/?url=',DEF_PARSER='https://jx.playerjy.com/?url=',TERMS=['现代','校园','同学','职场','都市','奇幻','后宫','系统','伦理','逆袭','大女主','大男主','悬疑','修仙','穿越','家庭','禁忌','同性','高分'];let SITE=localStorage.getItem('hg_site')||DEF_SITE,PROXY=localStorage.getItem('hg_proxy')??DEF_PROXY,PARSER=localStorage.getItem('hg_parser')||DEF_PARSER,category='home',pg=1,dramaId='',dramaTitle='',tracks=[],current=0,source='',route=0,hls=null,recommend=[];const $=id=>document.getElementById(id),cache=new Map(),KEY=CryptoJS.enc.Utf8.parse('f5d965df75336270'),IV=CryptoJS.enc.Utf8.parse('97b60394abc2fbe1');
function txt(s){return String(s||'').replace(/<[^>]*>/g,'').trim()}function abs(u){if(!u)return '';if(u.startsWith('//'))return'https:'+u;if(u.startsWith('/'))return SITE+u;return u}function fullUrl(u){if(!u)return '';if(u.startsWith('javascript:')||u.startsWith('#'))return '';if(u.startsWith('//'))return'https:'+u;return u.startsWith('http')?u:new URL(u,SITE).href}function px(u){return PROXY?(PROXY+(PROXY.includes('?')?encodeURIComponent(u):u)):u}async function proxyFetch(u){const r=await fetch(px(u));if(!r.ok)throw Error('HTTP '+r.status);return await r.text()}async function directFetch(u){const r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);return await r.text()}function path(c,p){if(c==='home')return p===1?SITE+'/':SITE+'/ai-duanju/'+p+'/';if(c.includes('rank'))return SITE+'/ranks/hot/';return p===1?SITE+'/'+c+'/':SITE+'/'+c+'/'+p+'/'}
function epRaw(s){const m=s.match(/hg-ep-time__at[^>]*>([\s\S]*?)<\/i>/i),time=m?txt(m[1]):'',ep=txt(s.replace(/<i\b[^>]*>[\s\S]*?<\/i>/gi,''));return{ep,time}}function grids(h,all){const r=/<div\s+class="[^"]*\bhg-card-grid\b[^"]*"[^>]*>/g,a=[];let m;while(m=r.exec(h))a.push(m.index+m[0].length);return a.slice(0,all?a.length:1).map((x,i)=>h.slice(x,a[i+1]||h.length))}function parseCards(h,all){const out=[],seen={};for(const s of grids(h,all)){const r=/<div\s+class="[^"]*\bhg-drama-card\b[^"]*"[^>]*>/g,a=[];let m;while(m=r.exec(s))a.push(m.index+m[0].length);a.forEach((x,i)=>{const b=s.slice(x,a[i+1]||s.length),id=(b.match(/href="[^"]*\/detail\/(\d+)\//)||[])[1];if(!id||seen[id])return;const n=b.match(/hg-drama-card__title[^>]*>([\s\S]*?)<\/a>/),im=b.match(/data-src="([^"]+)"/)||b.match(/src="([^"]+)"/),em=b.match(/hg-drama-card__episode[^>]*>([\s\S]*?)<\/(?:span|div)>/),sm=b.match(/hg-drama-card__score[^>]*>([\s\S]*?)<\/(?:span|div)>/),e=epRaw(em?em[1]:''),name=n?txt(n[1]):'',score=sm?txt(sm[1]):'';if(!name)return;seen[id]=1;out.push({id,name,pic:abs(im?im[1]:''),ep:e.ep,time:e.time,score,remarks:[e.ep,e.time,score].filter(Boolean).join(' · ')})})}return out}function parseRanks(h){const s=h.slice((h.match(/<div\s+class="[^"]*\bhg-rank-list\b[^"]*"[^>]*>/)||{index:0}).index||0),r=/<div\s+class="[^"]*\bhg-rank-item\b[^"]*"[^>]*>/g,a=[];let m;while(m=r.exec(s))a.push(m.index+m[0].length);return a.map((x,i)=>{const b=s.slice(x,a[i+1]||s.length),id=(b.match(/href="[^"]*\/detail\/(\d+)\//)||[])[1],n=b.match(/hg-rank-item__title[^>]*>([\s\S]*?)<\/h2>/),im=b.match(/data-src="([^"]+)"/)||b.match(/src="([^"]+)"/),tg=b.match(/hg-rank-item__tags[^>]*>([\s\S]*?)<\/div>/);return id&&n?{id,name:txt(n[1]),pic:abs(im?im[1]:''),remarks:tg?txt(tg[1]):''}:null}).filter(Boolean)}
function decrypt(ab){const u=new Uint8Array(ab),plain=u[0]===255&&u[1]===216||u[0]===137&&u[1]===80||u[0]===82&&u[1]===73||u[0]===71&&u[1]===73;if(plain||u.length%16)return new Blob([ab]);try{const w=[];for(let i=0;i<u.length;i+=4)w.push((u[i]<<24)|((u[i+1]||0)<<16)|((u[i+2]||0)<<8)|(u[i+3]||0));let h=CryptoJS.enc.Hex.stringify(CryptoJS.AES.decrypt({ciphertext:CryptoJS.lib.WordArray.create(w,u.length)},KEY,{iv:IV,mode:CryptoJS.mode.CBC,padding:CryptoJS.pad.NoPadding})).toLowerCase();if(!h.startsWith('ffd8'))return new Blob([ab]);const end=h.lastIndexOf('ffd9');if(end>=0)h=h.slice(0,end+4);const o=new Uint8Array(h.length/2);for(let i=0;i<o.length;i++)o[i]=parseInt(h.slice(i*2,i*2+2),16);return new Blob([o],{type:'image/jpeg'})}catch(e){return new Blob([ab])}}async function pic(im,u){if(!u)return;if(cache.has(u)){im.src=cache.get(u);return}try{const r=await fetch(px(u)),o=URL.createObjectURL(decrypt(await r.arrayBuffer()));cache.set(u,o);im.src=o}catch(e){im.src=u}}
function renderGrid(a){const r=$('list');r.innerHTML='';const g=document.createElement('div');g.className='grid';a.forEach(x=>{const c=document.createElement('div');c.className='card';c.onclick=()=>go(x.id,1);const cv=document.createElement('div');cv.className='cover',im=document.createElement('img');pic(im,x.pic);cv.append(im);if(x.ep)cv.insertAdjacentHTML('beforeend','<span class="badge ep">'+x.ep+'</span>');if(x.score)cv.insertAdjacentHTML('beforeend','<span class="badge score">'+x.score+'</span>');c.append(cv);c.insertAdjacentHTML('beforeend','<div class="info"><div class="name">'+x.name+'</div>'+(x.time?'<div class="time">'+x.time+'</div>':'')+'</div>');g.append(c)});r.append(g)}function renderRank(a){const r=$('list');r.innerHTML='';a.forEach((x,i)=>{const e=document.createElement('div');e.className='rank';e.onclick=()=>go(x.id,1);const im=document.createElement('img');pic(im,x.pic);e.innerHTML='<div class="rankno">'+(i+1)+'</div>';e.append(im);e.insertAdjacentHTML('beforeend','<div class="rankmeta"><div class="rankname">'+x.name+'</div><div class="ranktags">'+x.remarks+'</div></div>');r.append(e)})}function renderPages(show){const r=$('pages');if(!show){r.style.display='none';return}r.style.display='flex';r.innerHTML='<button class="pagebtn" '+(pg<=1?'disabled':'')+' onclick="change(-1)">◀ 上一页</button>';for(let n=Math.max(1,pg-2);n<Math.max(1,pg-2)+5;n++)r.innerHTML+='<button class="pagebtn pnum '+(n===pg?'active':'')+' onclick="load(category,'+n+')">'+n+'</button>';r.innerHTML+='<button class="pagebtn" onclick="change(1)">下一页 ▶</button>'}
async function load(c,p=1){category=c;pg=p;$('list').innerHTML='<div class="loading">正在加载第 '+p+' 页...</div>';renderPages(false);try{const h=await proxyFetch(path(c,p)),a=c.includes('rank')?parseRanks(h):parseCards(h,c==='home'&&p===1);recommend=a;c.includes('rank')?renderRank(a):renderGrid(a);renderPages(!c.includes('rank'))}catch(e){$('list').innerHTML='<div class="error">加载失败：'+e.message+'</div>'}}function change(d){if(pg+d>0){load(category,pg+d);scrollTo({top:0,behavior:'smooth'})}}function switchTab(c){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.x===c));load(c,1)}async function searchNow(q){q=(q||$('search').value).trim();if(!q)return;$('search').value=q;$('list').innerHTML='<div class="loading">正在搜索：'+q+'</div>';renderPages(false);try{const a=parseCards(await proxyFetch(SITE+'/search/video/'+encodeURIComponent(q)+'/'),false);recommend=a;a.length?renderGrid(a):$('list').innerHTML='<div class="loading">未找到“'+q+'”相关内容</div>'}catch(e){$('list').innerHTML='<div class="error">搜索失败：'+e.message+'</div>'}}
function tags(h,title){const d=new DOMParser().parseFromString(h,'text/html'),o=[],add=x=>{x=txt(x);if(TERMS.includes(x)&&!o.includes(x))o.push(x)};d.querySelectorAll('[class*="tag"] a,[class*="tag"] span,[class*="type"] a,[class*="type"] span').forEach(x=>add(x.textContent));const all=(title+' '+(d.querySelector('.hg-web-detail__desc,.hg-web-detail__intro')?.textContent||'')).toLowerCase();TERMS.forEach(x=>{if(all.includes(x.toLowerCase()))add(x)});for(const x of ['现代','都市','职场','系统','校园'])if(o.length<4&&!o.includes(x))o.push(x);return o.slice(0,5)}function renderTags(a){const r=$('tags');r.innerHTML='';a.forEach(x=>{const b=document.createElement('button');b.className='tag';b.innerHTML='<b>#</b>'+x;b.onclick=()=>{backHome();setTimeout(()=>searchNow(x),50)};r.append(b)})}
function go(id,ep){location.hash='#/video/'+id+'/ep-'+ep}function backHome(){stop();location.hash='#/'}window.addEventListener('hashchange',router);async function router(){const m=location.hash.match(/#\/video\/([^/]+)\/ep-(\d+)/);if(!m){$('play').classList.remove('active');$('home').classList.add('active');return}$('home').classList.remove('active');$('play').classList.add('active');await openDetail(m[1],+m[2])}
/* 原生直连：严格保留参考附件的直接 fetch 调用方式。详情与播放页均不通过 Worker。 */
async function openDetail(id,target){dramaId=id;$('title').textContent='正在加载剧集...';$('debug').textContent='正在以原生方式请求详情页...';try{const h=await directFetch(SITE+'/detail/'+id+'/'),d=new DOMParser().parseFromString(h,'text/html'),n=d.querySelector('.hg-web-detail__title,h1');dramaTitle=n?txt(n.textContent):'短剧播放';tracks=[];d.querySelectorAll('.hg-web-detail__ep-grid a').forEach((a,i)=>{const href=a.getAttribute('href'),ep=a.getAttribute('data-ep-id')||String(i+1);if(href)tracks.push({ep:String(ep),name:'第'+ep+'集',url:fullUrl(href)})});if(!tracks.length){const a=d.querySelector('.hg-web-detail__play[href]');if(a)tracks.push({ep:'1',name:'第1集',url:fullUrl(a.getAttribute('href'))})}if(!tracks.length)throw Error('未解析到剧集列表');current=Math.max(0,tracks.findIndex(x=>x.ep===String(target)));$('navTitle').textContent=dramaTitle;renderTags(tags(h,dramaTitle));renderEps();await playCurrent();renderRecs()}catch(e){$('title').textContent='加载失败：'+e.message;$('debug').textContent='❌ '+e.message}}
function renderEps(){const r=$('eps');r.innerHTML='';tracks.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x.ep;b.className=i===current?'active':'';b.onclick=()=>go(dramaId,x.ep);r.append(b)});$('title').textContent=dramaTitle+' '+(tracks[current]?.name||'')}
async function playCurrent(){const t=tracks[current];if(!t)return;stop();source='';$('debug').textContent='正在以原生方式提取 '+t.name+' 视频源...';try{const h=await directFetch(t.url),m=h.match(/id="videoInitialData"[^>]*>([\s\S]*?)<\/script>/);if(!m)throw Error('播放页缺少 videoInitialData');const d=JSON.parse(m[1]),src=d.epPlaySrcs||{};let u=String(src[t.ep]||d.videoSrc||'').replace(/\\u0026/g,'&').trim();if(!u.startsWith('http'))u=(u.match(/https?:\/\/[^\s"']+/)||[])[0]||'';if(!u)throw Error('未从 epPlaySrcs['+t.ep+']提取真实视频源');source=u;$('debug').textContent='✅ 已从原始播放页提取真实视频源。';setRoute(/\.(m3u8|mp4)(?:$|[?#])/i.test(source)?0:1)}catch(e){$('debug').textContent='❌ 视频源解析失败：'+e.message}}
function setRoute(i){route=i;document.querySelectorAll('.route').forEach((x,n)=>x.classList.toggle('active',n===i));if(source)run()}function run(){stop();const v=$('video'),f=$('frame'),native=/\.(m3u8|mp4)(?:$|[?#])/i.test(source);if(route===0&&native){v.style.display='block';if(/\.m3u8(?:$|[?#])/i.test(source)&&Hls.isSupported()){hls=new Hls();hls.loadSource(source);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)$('debug').textContent='⚠️ 视频源正确但 HLS 被防盗链/网络拦截，请用公共解析。'})}else{v.src=source;v.addEventListener('loadedmetadata',()=>v.play().catch(()=>{}),{once:true})}}else{f.style.display='block';f.src=PARSER+encodeURIComponent(source)}}function stop(){if(hls){hls.destroy();hls=null}const v=$('video'),f=$('frame');v.pause();v.removeAttribute('src');v.load();f.src='';v.style.display='none';f.style.display='none'}function step(d){const n=current+d;if(n>=0&&n<tracks.length)go(dramaId,tracks[n].ep);else alert(d<0?'已经是第一集':'已经是最后一集')}function fullScreen(){const p=$('player'),on=p.classList.toggle('webfull');$('fullText').textContent=on?'× 退出全屏':'⛶ 网页全屏';document.body.style.overflow=on?'hidden':''}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('player').classList.contains('webfull'))fullScreen()});function renderRecs(){const r=$('recs');r.innerHTML='';(recommend.slice(0,3).length?recommend.slice(0,3):[{id:'mock_2',name:'高三爱情故事',remarks:'全24集'}]).forEach(x=>{const e=document.createElement('div');e.className='rec';e.onclick=()=>go(x.id,1);const im=document.createElement('img');pic(im,x.pic);e.append(im);e.insertAdjacentHTML('beforeend','<div><strong>'+x.name+'</strong><p>'+x.remarks+'</p><p>高人气短剧，支持连续播放</p></div>');r.append(e)})}function mock(){const a=[{id:'mock_5161',name:'我的岳母苏沛真',ep:'更新至38集',score:'9.9分',time:'4小时前'},{id:'mock_2',name:'高三爱情故事',ep:'全24集',score:'9.8分',time:'1天前'}];recommend=a;renderGrid(a);renderPages(true)}
function auth(){$('pwd').value='';$('auth').classList.add('show')}function close(x){$(x).classList.remove('show')}function checkPwd(){if($('pwd').value===(localStorage.getItem('hg_admin_pwd')||'admin888')){close('auth');settings()}else alert('密码错误')}function settings(){$('proxy').value=PROXY;$('site').value=SITE;$('parser').value=PARSER;$('newpwd').value='';$('setting').classList.add('show')}function save(){SITE=$('site').value.trim()||DEF_SITE;PROXY=$('proxy').value.trim();PARSER=$('parser').value.trim()||DEF_PARSER;const p=$('newpwd').value.trim();if(p)localStorage.setItem('hg_admin_pwd',p);localStorage.setItem('hg_site',SITE);localStorage.setItem('hg_proxy',PROXY);localStorage.setItem('hg_parser',PARSER);cache.clear();close('setting');load(category,pg)}window.addEventListener('DOMContentLoaded',()=>location.hash.startsWith('#/video/')?router():load('home',1));
</script></body></html>
