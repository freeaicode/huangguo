<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no">
  <meta name="referrer" content="no-referrer">
  <title>HLS 播放引擎</title>
  
  <!-- 腾讯云 TCPlayer 样式与 SDK -->
  <link href="https://web.sdk.qcloud.com/player/tcplayer/release/v4.9.1/tcplayer.min.css" rel="stylesheet">
  <script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.9.1/tcplayer.v4.9.1.min.js"></script>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    /* 让播放器在移动端自动撑满全屏 */
    #player-container-id {
      width: 100% !important;
      height: 100% !important;
    }
    .tcplayer {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>

<video id="player-container-id" preload="auto" playsinline webkit-playsinline x5-playsinline>
</video>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // 获取主页面通过 iframe 传过来的 ?url= 视频地址
    const urlParams = new URLSearchParams(window.location.search);
    const videoSrc = urlParams.get('url');

    if (!videoSrc) {
      console.error("未找到播放地址");
      return;
    }

    // 初始化腾讯云 TCPlayer
    var player = TCPlayer("player-container-id", {
      sources: [{
        src: videoSrc,
        type: "m3u8" // 指定流媒体类型为 HLS (m3u8)
      }],
      autoplay: true,      // 自动播放
      fluid: true,         // 自适应流体布局
      live: false          // 点播模式
    });

    // 监听主页面发来的控制指令 (倍速、播放/暂停)
    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.type === 'set-speed') {
        player.playbackRate(e.data.speed);
      } else if (e.data.type === 'toggle-play') {
        if (player.paused()) {
          player.play();
        } else {
          player.pause();
        }
      }
    });

    // 同步播放状态回传给主页面 (用于联动 UI 封面与播放按钮)
    player.on('play', () => {
      window.parent.postMessage({ type: 'video-state', state: 'play' }, '*');
    });

    player.on('pause', () => {
      window.parent.postMessage({ type: 'video-state', state: 'pause' }, '*');
    });

    // 监听视频元数据加载，向主页面汇报横竖屏状态
    player.on('loadedmetadata', () => {
      const videoEl = document.querySelector('#player-container-id');
      if (videoEl) {
        const isPortrait = videoEl.videoHeight > videoEl.videoWidth;
        window.parent.postMessage({ type: 'video-meta', isPortrait }, '*');
      }
    });
  });
</script>
</body>
</html>
