<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <title>黄果短剧 - 沉浸式短剧版</title>
    <!-- 引入播放及解密依赖 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.min.js"></script>
    <style>
        /* ==================== 全局基础样式 ==================== */
        :root{--bg:#0b0c10;--card:#151821;--card2:#1f2432;--line:#2a3040;--pink:#ff3358;--yellow:#ffcc00;--text:#f8fafc;--muted:#9aa1b2;--dim:#626a7e}
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{margin:0 auto;max-width:500px;min-height:100vh;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; overflow-x:hidden;}
        
        .view{display:none}
        .view.active{display:block}
        
        /* ---------------- 主页样式 ---------------- */
        .header{position:sticky;top:0;z-index:30;background:rgba(11,12,16,.95);backdrop-filter:blur(12px);padding:10px 14px;border-bottom:1px solid var(--line)}
        .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
        .brand{font-size:17px;font-weight:800;cursor:pointer}
        .brand b{color:var(--pink)}
        button{font:inherit;cursor:pointer;border:none;outline:none;}
        
        .search{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;background:#1a1e2b;border:1px solid var(--line);border-radius:20px}
        .search input{flex:1;min-width:0;color:#fff;background:transparent;border:0;outline:0}
        .search button{color:var(--pink);background:transparent;font-weight:700}
        
        .tabs{display:flex;gap:8px;overflow-x:auto;padding-top:9px;}
        .tabs::-webkit-scrollbar{display:none}
        .tab{white-space:nowrap;padding:5px 12px;border-radius:16px;background:transparent;border:1px solid var(--line);color:var(--muted)}
        .tab.active{color:#fff;background:var(--pink);border-color:var(--pink)}
        
        main{padding:12px}
        .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
        .card{overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:7px;cursor:pointer}
        .cover{position:relative;aspect-ratio:3/4;background:#202633}
        .cover img{display:block;width:100%;height:100%;object-fit:cover}
        .badge{position:absolute;padding:2px 5px;border-radius:4px;background:rgba(0,0,0,.75);font-size:10px}
        .ep{top:4px;left:4px;color:var(--yellow)}
        .score{right:4px;bottom:4px;background:rgba(255,51,88,.9)}
        .info{padding:7px 8px}
        .name{min-height:32px;font-size:12px;font-weight:600;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
        .loading{text-align:center;padding:50px 10px;color:var(--muted)}

        /* ==================== 沉浸式短剧播放页 ==================== */
        #player-view { position: fixed; inset: 0; width: 100vw; height: 100dvh; background: #000; z-index: 1000; overflow: hidden; }
        
        /* 视频图层 (加入了海报封面) */
        .video-layer { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; display: flex; justify-content: center; align-items: center; }
        .video-layer video, .video-layer iframe { width: 100%; height: 100%; border: none; object-fit: cover; }
        
        /* 播放器封面 (未播放和暂停时显示) */
        .player-poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; transition: opacity 0.3s ease; pointer-events: none; filter: brightness(0.85); background: #000; }
        .player-poster.hidden { opacity: 0; }

        /* 沉浸式 UI 图层 */
        .ui-layer { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
        
        /* 允许用户点击的元素开启 pointer-events */
        .ui-top, .ui-right, .ui-bottom-controls, .click-layer { pointer-events: auto; }
        
        /* 中间透明点击层（用于原生视频点击暂停/播放） */
        .click-layer { position: absolute; inset: 0; z-index: -1; }

        /* 顶部导航 */
        .ui-top { padding: 45px 15px 15px; display: flex; align-items: center; gap: 12px; background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%); }
        .ui-back { width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: 300; cursor: pointer; color: #fff; }
        .ui-logo-box { display: flex; align-items: center; gap: 6px; }
        .ui-logo-icon { width: 28px; height: 28px; background: var(--yellow); border-radius: 50%; display: flex; justify-content: center; align-items: center; position: relative; }
        .ui-logo-icon::after { content: ''; width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 8px solid #fff; margin-left: 2px; }
        .ui-logo-text { display: flex; flex-direction: column; line-height: 1.1; }
        .ui-logo-text b { font-size: 15px; font-weight: 900; letter-spacing: 1px; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        .ui-logo-text b span { color: var(--yellow); font-size: 10px; vertical-align: top; margin-left: 2px;}
        .ui-logo-text small { font-size: 10px; color: rgba(255,255,255,0.8); font-family: monospace; }

        /* 右侧互动区 */
        .ui-right { position: absolute; right: 12px; bottom: 130px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .action-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #fff; cursor: pointer; }
        .action-icon { width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: center; font-size: 18px; text-shadow: 0 1px 4px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(4px); transition: transform 0.1s; }
        .action-item:active .action-icon { transform: scale(0.9); }
        .action-item span { font-size: 11px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .speed-icon { width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.3); display: flex; justify-content: center; align-items: center; font-size: 13px; font-weight: bold; backdrop-filter: blur(4px); }

        /* 底部信息区 */
        .ui-bottom { background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 40%, transparent 100%); padding-top: 40px; }
        .ui-info { padding: 0 15px 12px; width: 85%; }
        .ui-title { font-size: 18px; font-weight: bold; margin: 0 0 6px 0; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .ui-desc { font-size: 13px; color: rgba(255,255,255,0.8); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* 进度条 */
        .ui-progress-bar { width: 100%; height: 2px; background: rgba(255,255,255,0.2); position: relative; margin-bottom: 5px; }
        .ui-progress-fill { height: 100%; background: var(--yellow); width: 0%; position: relative; }
        .ui-progress-dot { width: 8px; height: 8px; background: var(--yellow); border-radius: 50%; position: absolute; right: -4px; top: -3px; }

        /* 底部选集控制栏 */
        .ui-bottom-controls { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px 25px; color: rgba(255,255,255,0.9); font-size: 13px; cursor: pointer; }
        .ui-ep-left { display: flex; align-items: center; gap: 6px; font-weight: 500; }
        .ui-ep-right { display: flex; align-items: center; gap: 15px; font-size: 16px; }
        
        /* 中间播放/暂停大图标提示 */
        .play-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; background: rgba(0,0,0,0.5); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 24px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .play-indicator.show { opacity: 1; }

        /* ==================== 底部弹窗 (选集与线路) ==================== */
        .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1001; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
        
        .bottom-sheet { position: fixed; bottom: 0; left: 0; width: 100vw; height: 65vh; background: var(--card); z-index: 1002; border-radius: 16px 16px 0 0; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); display: flex; flex-direction: column; }
        .bottom-sheet.show { transform: translateY(0); }
        
        .sheet-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sheet-header h3 { margin: 0; font-size: 16px; font-weight: bold; }
        .sheet-close { width: 30px; height: 30px; border-radius: 50%; background: var(--card2); display: flex; justify-content: center; align-items: center; color: var(--muted); cursor: pointer; font-size: 16px; }
        
        .sheet-content { padding: 15px 20px; overflow-y: auto; flex: 1; }
        .sheet-section-title { font-size: 13px; color: var(--muted); margin-bottom: 10px; display: block; }
        
        .routes { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 25px; }
        .route { padding: 8px 14px; border-radius: 20px; background: var(--card2); color: var(--text); border: 1px solid transparent; font-size: 12px; }
        .route.active { background: rgba(255,204,0,0.1); color: var(--yellow); border-color: var(--yellow); }
        
        .episodes-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .ep-btn { height: 45px; border-radius: 8px; background: var(--card2); color: var(--text); display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: 600; border: none; }
        .ep-btn.active { background: var(--pink); color: #fff; }
    </style>
</head>
<body>

    <!-- Tailwind HLS 纯净播放器代码模板 (已添加 postMessage 回调同步状态) -->
<textarea id="tailwind-player-tpl" style="display:none;">
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS Video Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <style>
        html, body { width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0; background: transparent; }
        .video-wrapper { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        video { max-width: 100%; max-height: 100%; object-fit: cover; outline: none; width:100%; height:100%; }
    </style>
</head>
<body>
    <div class="video-wrapper">
        <video id="video-player" autoplay playsinline></video>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('video-player');
            const streamUrl = "{{VIDEO_URL}}"; 
            const initialSpeed = parseFloat("{{PLAY_SPEED}}") || 1.0;
            let hls = null;

            // 监听父级传递的消息 (倍速/播放暂停)
            window.addEventListener('message', (e) => {
                if (!e.data) return;
                if (e.data.type === 'set-speed') {
                    video.playbackRate = e.data.speed;
                } else if (e.data.type === 'toggle-play') {
                    if (video.paused) video.play(); else video.pause();
                }
            });

            // 回传播放状态给父级（隐藏封面、更新右侧按钮）
            video.addEventListener('play', () => { window.parent.postMessage({ type: 'video-state', state: 'play' }, '*'); });
            video.addEventListener('pause', () => { window.parent.postMessage({ type: 'video-state', state: 'pause' }, '*'); });
            
            // iframe 内部点击事件
            video.addEventListener('click', () => {
                if(video.paused) video.play(); else video.pause();
            });

            const loadStream = (url) => {
                if (!url) return;
                if (hls) hls.destroy();
                if (Hls.isSupported()) {
                    hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.playbackRate = initialSpeed;
                        video.play().catch(()=>{});
                    });
                } 
                else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.addEventListener('loadedmetadata', () => {
                        video.playbackRate = initialSpeed;
                        video.play().catch(()=>{});
                    });
                }
            };
            loadStream(streamUrl);
        });
    </script>
</body>
</html>
</textarea>

<script>
    const SITE = 'https://huangguoai.com';
    let hls = null;
    let currentPlayUrl = ''; 
    let currentRouteIndex = 0;
    let categoryMap = {};
    window.currentTracks = [];
    window.activePoster = ''; // 用于存储从首页点击的封面
    
    // 全局播放倍速状态
    let currentPlaybackSpeed = 1.0;

    const ROUTES = [
        { type: 'native', prefix: '' },
        { type: 'iframe', prefix: 'https://jx.playerjy.com/?url=' },
        { type: 'tailwind_hls', prefix: '' }, 
        { type: 'iframe', prefix: 'https://jx.aidouer.net/?url=' }
    ];

    // ==================== 父级通信与状态同步 ====================
    window.addEventListener('message', (e) => {
        if (!e.data) return;
        if (e.data.type === 'video-meta') {
            const container = document.getElementById('video-container');
            if (e.data.isPortrait) container.classList.add('portrait');
            else container.classList.remove('portrait');
        }
        // 同步 HLS iframe 的播放/暂停状态到父 UI
        if (e.data.type === 'video-state') {
            handlePlayStateChange(e.data.state === 'play');
        }
    });

    // ==================== 右侧功能逻辑 (倍速 & 播放 & 分享) ====================
    function toggleSpeed() {
        const speeds = [1.0, 1.25, 1.5, 2.0];
        let idx = speeds.indexOf(currentPlaybackSpeed);
        idx = (idx + 1) % speeds.length;
        currentPlaybackSpeed = speeds[idx];
        
        document.getElementById('speedText').innerText = currentPlaybackSpeed + 'X';
        
        const videoEl = document.getElementById('videoPlayer');
        if (videoEl && videoEl.style.display !== 'none') {
            videoEl.playbackRate = currentPlaybackSpeed;
        }
        
        const iframe = document.getElementById('iframePlayer');
        if (iframe && iframe.contentWindow && ROUTES[currentRouteIndex].type === 'tailwind_hls') {
            iframe.contentWindow.postMessage({ type: 'set-speed', speed: currentPlaybackSpeed }, '*');
        }
    }

    function shareAction() {
        if (navigator.share) {
            navigator.share({ title: document.title, url: location.href }).catch(()=>{});
        } else {
            const input = document.createElement('input');
            input.value = location.href;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            alert('当前页面链接已复制！');
        }
    }

    // ==================== 统一的播放/暂停交互逻辑 ====================
    const videoEl = document.getElementById('videoPlayer');
    const playIndicator = document.getElementById('playIndicator');
    const progressFill = document.getElementById('progressFill');

    function togglePlayPause() {
        const routeType = ROUTES[currentRouteIndex].type;
        const iframe = document.getElementById('iframePlayer');

        if (routeType === 'native') {
            if (videoEl.paused) videoEl.play(); else videoEl.pause();
        } else if (routeType === 'tailwind_hls') {
            if (iframe.contentWindow) iframe.contentWindow.postMessage({ type: 'toggle-play' }, '*');
        }
    }

    // 中间空白区域点击
    document.getElementById('clickLayer').addEventListener('click', togglePlayPause);

    // 原生视频事件监听
    videoEl.addEventListener('play', () => handlePlayStateChange(true));
    videoEl.addEventListener('pause', () => handlePlayStateChange(false));
    videoEl.addEventListener('timeupdate', () => {
        if (videoEl.duration) {
            progressFill.style.width = ((videoEl.currentTime / videoEl.duration) * 100) + '%';
        }
    });

    // 处理 UI 的暂停与播放状态联动（隐藏封面，更新图标）
    function handlePlayStateChange(isPlaying) {
        const posterEl = document.getElementById('playerPoster');
        const icon = document.getElementById('playPauseIcon');
        const text = document.getElementById('playPauseText');

        if (isPlaying) {
            posterEl.classList.add('hidden');
            icon.innerText = '⏸';
            text.innerText = '暂停';
            playIndicator.classList.remove('show');
        } else {
            posterEl.classList.remove('hidden');
            icon.innerText = '▶';
            text.innerText = '播放';
            playIndicator.innerText = '⏸';
            playIndicator.classList.add('show');
            setTimeout(() => playIndicator.classList.remove('show'), 800);
        }
    }

    // ==================== 底部弹窗逻辑 ====================
    function toggleSheet() {
        const sheet = document.getElementById('bottomSheet');
        const backdrop = document.getElementById('sheetBackdrop');
        const isShow = sheet.classList.contains('show');
        if (isShow) {
            sheet.classList.remove('show');
            backdrop.classList.remove('show');
        } else {
            sheet.classList.add('show');
            backdrop.classList.add('show');
        }
    }

    // ==================== 图片解密核心 ====================
    const KEY = CryptoJS.enc.Utf8.parse('f5d965df75336270');
    const IV = CryptoJS.enc.Utf8.parse('97b60394abc2fbe1');
    const PROXY = 'https://hg-img.bobox.de5.net/?url=';
    const cache = new Map();

    function px(u){ return PROXY ? (PROXY + (PROXY.includes('?') ? encodeURIComponent(u) : u)) : u; }

    function decrypt(ab) {
        const u = new Uint8Array(ab), plain = u[0]===255&&u[1]===216 || u[0]===137&&u[1]===80 || u[0]===82&&u[1]===73 || u[0]===71&&u[1]===73;
        if(plain || u.length % 16) return new Blob([ab]);
        try {
            const w = [];
            for(let i=0; i<u.length; i+=4) w.push((u[i]<<24) | ((u[i+1]||0)<<16) | ((u[i+2]||0)<<8) | (u[i+3]||0));
            let h = CryptoJS.enc.Hex.stringify(CryptoJS.AES.decrypt(
                {ciphertext: CryptoJS.lib.WordArray.create(w, u.length)},
                KEY, {iv: IV, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.NoPadding}
            )).toLowerCase();
            
            if(!h.startsWith('ffd8')) return new Blob([ab]);
            const end = h.lastIndexOf('ffd9');
            if(end >= 0) h = h.slice(0, end+4);
            
            const o = new Uint8Array(h.length/2);
            for(let i=0; i<o.length; i++) o[i] = parseInt(h.slice(i*2, i*2+2), 16);
            return new Blob([o], {type: 'image/jpeg'});
        } catch(e) { return new Blob([ab]); }
    }

    async function pic(im, u) {
        if(!u) return;
        if(cache.has(u)) { im.src = cache.get(u); return; }
        try {
            const r = await fetch(px(u));
            if(!r.ok) throw new Error('HTTP ' + r.status);
            const o = URL.createObjectURL(decrypt(await r.arrayBuffer()));
            cache.set(u, o);
            im.src = o;
        } catch(e) { im.src = u; }
    }

    // ==================== 视图控制 ====================
    function showView(viewId) {
        document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        if (viewId === 'player-view') {
            document.body.style.overflow = 'hidden';
        } else {
            document.body.style.overflow = '';
        }
        window.scrollTo(0, 0);
    }

    function navToHome() {
        resetPlayerContext();
        window.location.hash = '';
        showView('home-view');
    }

    window.onhashchange = function() {
        const hash = window.location.hash;
        if (hash.startsWith('#detail/')) {
            showView('player-view');
            openDetail(hash.replace('#detail/', ''));
        } else {
            navToHome();
        }
    };

    function formatPageUrl(rawUrl) {
        if (!rawUrl) return '';
        rawUrl = rawUrl.trim();
        if (rawUrl.startsWith('javascript') || rawUrl.startsWith('#')) return '';
        if (rawUrl.startsWith('//')) return 'https:' + rawUrl;
        if (!rawUrl.startsWith('http')) return SITE + (rawUrl.startsWith('/') ? '' : '/') + rawUrl;
        return rawUrl;
    }

    function extractImgUrl(cardEl) {
        if (!cardEl) return '';
        const imgEl = cardEl.querySelector('img, [data-src], [data-original], [data-lazy-src]');
        let src = imgEl ? (imgEl.getAttribute('data-src') || imgEl.getAttribute('src')) : '';
        if (src && src.includes('/_next/image')) {
            try {
                const u = new URL(src.startsWith('http') ? src : SITE + src);
                const realUrl = u.searchParams.get('url');
                if (realUrl) src = decodeURIComponent(realUrl);
            } catch(e) {}
        }
        return formatPageUrl(src);
    }

    async function fetchHtml(url) {
        try {
            document.getElementById('loading').style.display = 'block';
            const res = await fetch(url);
            const text = await res.text();
            document.getElementById('loading').style.display = 'none';
            return text;
        } catch (e) {
            console.error(e);
            document.getElementById('loading').style.display = 'none';
            return '';
        }
    }

    function parseGridCards(html) {
        if (!html) return [];
        const list = [];
        const seen = {};
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        
        const cards = doc.querySelectorAll('.hg-drama-card, .hg-rank-item');
        cards.forEach(card => {
            const aTag = card.querySelector('a[href*="/detail/"]');
            if (!aTag) return;
            const href = aTag.getAttribute('href');
            const vidMatch = href.match(/\/detail\/(\d+)/);
            if (!vidMatch) return;
            const vid = vidMatch[1];
            if (seen[vid]) return; seen[vid] = true;
            
            const titleTag = card.querySelector('.hg-drama-card__title, .hg-rank-item__title');
            const title = titleTag ? titleTag.textContent.trim() : '未知剧名';
            const picUrl = extractImgUrl(card);
            
            const epTag = card.querySelector('.hg-drama-card__episode');
            const ep = epTag ? epTag.textContent.trim().replace(/更新至|全/g,'') : '';
            
            list.push({ vod_id: vid, vod_name: title, vod_pic: picUrl, ep: ep });
        });
        return list;
    }

    // ==================== 首页渲染逻辑 ====================
    async function loadHome() {
        document.getElementById('videoGrid').innerHTML = '';
        const html = await fetchHtml(SITE + '/');
        const doc = new DOMParser().parseFromString(html, 'text/html');
        
        doc.querySelectorAll('a').forEach(a => {
            const text = a.textContent.trim();
            const href = a.getAttribute('href');
            if (text && href && !href.startsWith('javascript') && !href.startsWith('#')) {
                const fullUrl = formatPageUrl(href);
                if (fullUrl && !fullUrl.includes('/detail/') && fullUrl !== SITE + '/') {
                    categoryMap[text] = fullUrl;
                }
            }
        });
        renderGrid(parseGridCards(html));
    }

    async function selectCategory(keyword, el) {
        document.querySelectorAll('.tab').forEach(tag => tag.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('searchInput').value = (keyword === '首页') ? '' : keyword;
        
        if (keyword === '首页') return loadHome();
        document.getElementById('videoGrid').innerHTML = '';
        
        let targetUrl = categoryMap[keyword] || '';
        if (!targetUrl) targetUrl = SITE + '/search/video/' + encodeURIComponent(keyword) + '/';

        let list = parseGridCards(await fetchHtml(targetUrl));
        if (list.length === 0 && !targetUrl.includes('/search/')) {
            list = parseGridCards(await fetchHtml(SITE + '/search/video/' + encodeURIComponent(keyword) + '/'));
        }
        renderGrid(list);
    }

    async function doSearch(kw) {
        kw = kw.trim();
        if (!kw) return loadHome();
        document.getElementById('videoGrid').innerHTML = '';
        document.querySelectorAll('.tab').forEach(tag => tag.classList.toggle('active', tag.innerText.includes(kw)));
        renderGrid(parseGridCards(await fetchHtml(SITE + '/search/video/' + encodeURIComponent(kw) + '/')));
    }

    function renderGrid(list) {
        const grid = document.getElementById('videoGrid');
        grid.innerHTML = ''; 
        list.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => {
                window.activePoster = item.vod_pic; // 记录被点击视频的封面
                window.location.hash = 'detail/' + item.vod_id;
            };
            
            const cv = document.createElement('div');
            cv.className = 'cover';
            const im = document.createElement('img');
            pic(im, item.vod_pic);
            cv.append(im);
            if (item.ep) cv.insertAdjacentHTML('beforeend', '<span class="badge ep">' + item.ep + '</span>');
            
            card.append(cv);
            card.insertAdjacentHTML('beforeend', '<div class="info"><div class="name">' + item.vod_name + '</div></div>');
            grid.appendChild(card);
        });
    }

    // ==================== 播放页核心逻辑 ====================
    async function openDetail(id) {
        document.getElementById('uiTitle').innerText = '加载中...';
        document.getElementById('epList').innerHTML = '';
        window.currentTracks = [];
        
        const html = await fetchHtml(SITE + '/detail/' + id + '/');
        if (!html) return;
        
        const doc = new DOMParser().parseFromString(html, 'text/html');
        
        // 抓取并设置封面 (优先取点击传递过来的值，其次从详情页抓取)
        let pUrl = window.activePoster || '';
        if (!pUrl) {
            const imgTags = doc.querySelectorAll('img[data-src]');
            if(imgTags.length > 0) pUrl = imgTags[0].getAttribute('data-src');
        }
        const posterEl = document.getElementById('playerPoster');
        if (pUrl) pic(posterEl, formatPageUrl(pUrl)); else posterEl.src = '';
        
        const titleEl = doc.querySelector('.hg-web-detail__title, h1');
        const rawTitle = titleEl ? titleEl.textContent.trim() : '未知剧集';
        document.getElementById('uiTitle').innerText = rawTitle;
        const descEl = doc.querySelector('.hg-web-detail__desc');
        document.getElementById('uiDesc').innerText = descEl ? descEl.textContent.trim() : rawTitle;

        const tracks = [];
        doc.querySelectorAll('.hg-web-detail__ep-grid a').forEach(a => {
            const href = a.getAttribute('href');
            const eid = a.getAttribute('data-ep-id');
            const name = eid ? eid : a.textContent.trim();
            if (href) tracks.push({ name: name, url: formatPageUrl(href), ep: eid || '1' });
        });
        
        if (tracks.length > 0) {
            window.currentTracks = tracks;
            document.getElementById('uiTotal').innerText = tracks.length;
            renderEpisodes(tracks);
            playEpisode(tracks[0].url, tracks[0].ep, 0); 
        }
    }

    function renderEpisodes(tracks) {
        const epList = document.getElementById('epList');
        epList.innerHTML = '';
        tracks.forEach((track, index) => {
            const btn = document.createElement('button');
            btn.className = 'ep-btn';
            btn.id = 'ep-btn-' + index;
            btn.innerText = track.ep;
            btn.onclick = () => {
                playEpisode(track.url, track.ep, index);
                toggleSheet(); // 选集后自动收起弹窗
            };
            epList.appendChild(btn);
        });
    }

    async function playEpisode(pageUrl, ep, index) {
        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
        const activeBtn = document.getElementById('ep-btn-' + index);
        if (activeBtn) activeBtn.classList.add('active');
        
        document.getElementById('uiCurrent').innerText = ep;
        resetPlayerContext();

        const html = await fetchHtml(pageUrl);
        let playUrl = '';
        const m = html.match(/id="videoInitialData"[^>]*>([\s\S]*?)<\/script>/);
        if (m) {
            try {
                const data = JSON.parse(m[1]);
                const srcs = data.epPlaySrcs || {};
                playUrl = srcs[ep] || data.videoSrc || '';
                playUrl = playUrl.replace(/\\u0026/g, '&');
                if (playUrl && playUrl.indexOf('http') !== 0) {
                    const mm = playUrl.match(/(https?:\/\/[^\s"']+)/);
                    playUrl = mm ? mm[1] : playUrl;
                }
            } catch (e) {}
        }

        if (!playUrl) return;
        currentPlayUrl = playUrl;
        
        if (!playUrl.includes('.m3u8') && !playUrl.includes('.mp4')) switchRoute(1);
        else executeRoute();
    }

    function switchRoute(index) {
        currentRouteIndex = index;
        document.querySelectorAll('.route').forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
        });
        if(currentPlayUrl) executeRoute();
    }

    function executeRoute() {
        resetPlayerContext();
        const route = ROUTES[currentRouteIndex];
        
        if (route.type === 'native' && (currentPlayUrl.includes('.m3u8') || currentPlayUrl.includes('.mp4'))) {
            document.getElementById('videoPlayer').style.display = 'block';
            document.getElementById('clickLayer').style.pointerEvents = 'auto'; // 开启原生视频点击层
            initHlsPlayer(currentPlayUrl);
            
        } else if (route.type === 'tailwind_hls') {
            const tpl = document.getElementById('tailwind-player-tpl').value;
            // 注入 URL 和全局设定的初始倍速
            const injectedHtml = tpl.replace('{{VIDEO_URL}}', currentPlayUrl.replace(/"/g, '&quot;'))
                                    .replace('{{PLAY_SPEED}}', currentPlaybackSpeed);
            const iframe = document.getElementById('iframePlayer');
            iframe.style.display = 'block';
            document.getElementById('clickLayer').style.pointerEvents = 'none'; // iframe自己处理点击
            iframe.srcdoc = injectedHtml;
        } else {
            let iframeUrl = route.prefix ? route.prefix + encodeURIComponent(currentPlayUrl) : currentPlayUrl;
            const iframe = document.getElementById('iframePlayer');
            iframe.style.display = 'block';
            document.getElementById('clickLayer').style.pointerEvents = 'none';
            // 第三方解析无法判定状态，直接隐藏封面
            document.getElementById('playerPoster').classList.add('hidden');
            iframe.src = iframeUrl;
        }
    }

    function resetPlayerContext() {
        if (hls) { hls.destroy(); hls = null; }
        videoEl.pause();
        videoEl.removeAttribute('src'); 
        videoEl.load(); 
        
        progressFill.style.width = '0%';
        handlePlayStateChange(false); // 强制重置为暂停(封面)状态

        const iframe = document.getElementById('iframePlayer');
        iframe.src = '';
        iframe.removeAttribute('srcdoc'); 
        videoEl.style.display = 'none';
        iframe.style.display = 'none';
    }

    function initHlsPlayer(url) {
        if (Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(videoEl);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                videoEl.playbackRate = currentPlaybackSpeed;
                videoEl.play().catch(()=>{});
            });
        } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
            videoEl.src = url;
            videoEl.addEventListener('loadedmetadata', () => {
                videoEl.playbackRate = currentPlaybackSpeed;
                videoEl.play().catch(()=>{});
            });
        }
    }

    window.onload = function() {
        loadHome();
        const hash = window.location.hash;
        if (hash.startsWith('#detail/')) {
            showView('player-view');
            openDetail(hash.replace('#detail/', ''));
        }
    };
</script>
