<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>黄果短剧聚合 Web 播放器</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.min.js"></script>
<style>
:root{--bg:#0b0c10;--card:#151821;--card2:#1f2432;--line:#2a3040;--pink:#ff3358;--text:#f8fafc;--muted:#9aa1b2;--dim:#626a7e}
*{box-sizing:border-box}
body{margin:0 auto;max-width:520px;min-height:100vh;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.view{display:none}.view.active{display:block}
.header{position:sticky;top:0;z-index:30;background:rgba(11,12,16,.96);backdrop-filter:blur(12px);padding:10px 14px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.brand{font-size:17px;font-weight:800;cursor:pointer}.brand b{color:var(--pink)}
button{font:inherit;cursor:pointer}
.icon,.tab,.route,.pagebtn,.node-btn{border:1px solid var(--line);background:var(--card);color:var(--muted)}
.icon{width:32px;height:32px;border-radius:50%;font-size:16px}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;background:#1a1e2b;border:1px solid var(--line);border-radius:20px}
.search input{flex:1;min-width:0;color:#fff;background:transparent;border:0;outline:0}
.search button{color:var(--pink);border:0;background:transparent;font-weight:700}
.tabs,.episodes,.taglist{display:flex;gap:8px;overflow:auto}
.tabs{padding-top:9px}.tabs::-webkit-scrollbar,.episodes::-webkit-scrollbar,.taglist::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:5px 12px;border-radius:16px;background:transparent;border-color:transparent}
.tab.active,.route.active{color:#fff;background:var(--pink);border-color:var(--pink)}
main{padding:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:7px;cursor:pointer;position:relative}
.cover{position:relative;aspect-ratio:3/4;background:#202633}
.cover img{display:block;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;padding:2px 5px;border-radius:4px;background:rgba(0,0,0,.75);font-size:10px}
.ep{top:4px;left:4px;color:#fbbf24}
.score{right:4px;bottom:4px;background:rgba(255,51,88,.9)}
.info{padding:7px 8px}
.name{min-height:32px;font-size:12px;font-weight:600;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.time{margin-top:3px;color:var(--dim);font-size:10px}
.loading,.error{text-align:center;padding:36px 12px;color:var(--muted)}
.error{color:#f87171}
.pagination{display:flex;justify-content:center;gap:7px;align-items:center;padding:20px 0}
.pagebtn{padding:6px 10px;border-radius:6px;font-size:12px}
.pagebtn:disabled{opacity:.35}
.pnum{min-width:30px;height:30px}
.rank{display:flex;gap:12px;align-items:center;margin-bottom:10px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:7px;cursor:pointer}
.rank img{width:55px;height:75px;object-fit:cover;background:#202633;border-radius:4px}
.rankno{width:22px;text-align:center;color:var(--dim);font-size:16px;font-weight:800}
.rank:nth-child(1) .rankno{color:#f43f5e}
.rank:nth-child(2) .rankno{color:#f97316}
.rank:nth-child(3) .rankno{color:#eab308}
.rankmeta{min-width:0;flex:1}
.rankname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ranktags{margin-top:5px;color:var(--muted);font-size:11px}
.footer{text-align:center;padding:22px 0 40px;color:var(--dim);font-size:11px}
.nav{position:sticky;top:0;z-index:31;display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 12px;background:rgba(11,12,16,.95);border-bottom:1px solid var(--line)}
.back{font-weight:600;cursor:pointer}
.navtitle{max-width:230px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player{position:sticky;top:48px;z-index:20;overflow:hidden;background:#000}
.player video,.player iframe{display:none;width:100%;height:55vh;max-height:580px;border:0;object-fit:contain}
.full{position:absolute;z-index:4;right:10px;top:10px;padding:5px 9px;color:#fff;background:rgba(0,0,0,.65);border:1px solid #555;border-radius:15px;font-size:11px}
.player.webfull{position:fixed;inset:0;top:0;z-index:9999;width:100vw;height:100dvh}
.player.webfull video,.player.webfull iframe{height:100%!important;max-height:none!important}
.debug{padding:8px 12px;overflow:hidden;color:var(--muted);background:#141722;font-size:12px;white-space:nowrap;text-overflow:ellipsis}
.routes{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--card)}
.routes small{font-size:11px;color:var(--dim);white-space:nowrap}
.route{padding:4px 10px;border-radius:12px;font-size:11px}
.detail{padding:12px}
.detail h1{margin:0 0 10px;font-size:16px}
.actions2{display:flex;gap:10px;margin-bottom:12px}
.actions2 button{flex:1;padding:9px;color:#fff;background:var(--card);border:1px solid var(--line);border-radius:6px}
.episodes button{min-width:46px;height:38px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:6px}
.episodes button.active{color:#fff;background:var(--pink);border-color:var(--pink)}
.modal{position:fixed;z-index:10001;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.75)}
.modal.show{display:flex}
.box{width:100%;max-width:420px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.box h3{margin:0 0 12px}
.box label{display:block;color:var(--muted);font-size:12px}
.box input{width:100%;margin:5px 0 12px;padding:9px 10px;color:#fff;background:#1a1e2b;border:1px solid var(--line);border-radius:6px}
.buttons{display:flex;justify-content:flex-end;gap:8px}
.buttons button{padding:7px 13px;color:#fff;background:var(--card2);border:1px solid var(--line);border-radius:5px}
.buttons .save{background:var(--pink);border-color:var(--pink)}
.nodes-bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.node-btn{padding:5px 10px;border-radius:4px;font-size:11px;color:#fff;background:var(--card2)}
</style>

<body>
<section id="home" class="view active">
  <header class="header">
    <div class="top">
      <div class="brand" onclick="switchTab('home')"><b>黄果</b> 短剧聚合</div>

    <div class="search">
      ⌕<input id="search" placeholder="搜索短剧、漫剧关键词" onkeydown="if(event.key==='Enter')searchNow()">
      <button onclick="searchNow()">搜索</button>
    </div>
    <div class="tabs">
      <button class="tab active" data-x="home" onclick="switchTab('home')">首页推荐</button>

      <button class="tab" data-x="ai-manju" onclick="switchTab('ai-manju')">AI漫剧</button>
      <button class="tab" data-x="ai-huanlian" onclick="switchTab('ai-huanlian')">AI换脸</button>
      <button class="tab" data-x="ai-mogai" onclick="switchTab('ai-mogai')">AI魔改</button>

  </header>
  <main>
    <div id="list"></div>
    <div id="pages" class="pagination" style="display:none"></div>

  </main>
</section>

<section id="play" class="view">
  <nav class="nav">
    <span class="back" onclick="backHome()">‹ 返回</span>
    <span id="navTitle" class="navtitle">短剧播放</span>
    <span></span>
  </nav>
  <div id="player" class="player">
    <button id="fullText" class="full" onclick="fullScreen()">⛶ 网页全屏</button>
    <video id="video" controls playsinline webkit-playsinline x5-playsinline></video>
    <iframe id="frame" allow="autoplay;fullscreen" allowfullscreen></iframe>
  </div>

  <div class="routes">
    <small>播放线路:</small>

  <div class="detail">
    <h1 id="title">正在加载剧集...</h1>

      <button onclick="step(-1)">上一集</button>
      <button onclick="step(1)">下一集</button>
    </div>
    <div id="eps" class="episodes"></div>
  </div>
</section>

<div id="setting" class="modal">
  <div class="box">
    <h3>网络与目标站点配置</h3>
    <label>代理 URL 前缀</label>
    <input id="proxy">
    <label>目标站域名</label>
    <input id="site">
    <label>一键切换可用线路节点：</label>
    <div class="nodes-bar">
      <button class="node-btn" onclick="applyNode('https://ni6b.xxpofweu.cc')">ni6b当前线路</button>
      <button class="node-btn" onclick="applyNode('https://dlvd.xxpofweu.cc')">dlvd官方线路</button>
      <button class="node-btn" onclick="applyNode('https://vzb1e.xxpofweu.cc')">vzb1e稳定线路</button>
      <button class="node-btn" onclick="applyNode('https://huangguo10.com')">huangguo10主站</button>
    </div>
    <label>公共解析接口</label>
    <input id="parser">
    <div class="buttons">
      <button onclick="closeModal('setting')">取消</button>
      <button class="save" onclick="saveSettings()">保存并刷新</button>
    </div>
  </div>
</div>

<script>
const DEF_SITE = 'https://ni6b.xxpofweu.cc';
const DEF_PROXY = 'https://hg-img.bobox.de5.net/?url=';
const DEF_PARSER = 'https://jx.playerjy.com/?url=';

let SITE = (localStorage.getItem('hg_site') || DEF_SITE).replace(/\/+$/, '');
let PROXY = localStorage.getItem('hg_proxy') ?? DEF_PROXY;
let PARSER = localStorage.getItem('hg_parser') || DEF_PARSER;

let category = 'home', pg = 1, dramaId = '', dramaTitle = '', tracks = [], current = 0, source = '', route = 0, hls = null;
const $ = id => document.getElementById(id);
const cache = new Map();

// 封面 AES-128-CBC 密钥
const KEY = CryptoJS.enc.Utf8.parse('f5d965df75336270');
const IV = CryptoJS.enc.Utf8.parse('97b60394abc2fbe1');

function txt(s){ return String(s || '').replace(/<[^>]*>/g, '').trim(); }
function cleanUrl(u){
  if (!u) return '';
  u = u.trim();
  if (u.startsWith('//')) return 'https:' + u;
  if (u.startsWith('http://') || u.startsWith('https://')) return u;
  return SITE + (u.startsWith('/') ? u : '/' + u);
}
function px(u){
  if (!u) return '';
  return PROXY ? (PROXY + (PROXY.includes('?') ? encodeURIComponent(u) : u)) : u;
}
async function proxyFetch(u){
  const res = await fetch(px(u));
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return await res.text();
}
function getPath(c, p){
  if (c === 'home') return p === 1 ? SITE + '/' : SITE + '/ai-duanju/' + p + '/';
  if (c.includes('rank')) return SITE + '/ranks/hot/';
  return p === 1 ? SITE + '/' + c + '/' : SITE + '/' + c + '/' + p + '/';
}

// 核心卡片解析：精准匹配黄果 .hg-drama-card 与 /detail/ 结构
function parseCards(html){
  if (!html) return [];
  const list = [], seen = {};
  
  // 1. 尝试以 .hg-drama-card 切片提取
  const cardRegex = /<(?:div|a|li)\s+[^>]*class="[^"]*\bhg-drama-card\b[^"]*"[^>]*>/gi;
  const starts = [];
  let m;
  while ((m = cardRegex.exec(html)) !== null) starts.push(m.index);

  if (starts.length) {
    for (let i = 0; i < starts.length; i++) {
      const block = html.slice(starts[i], starts[i + 1] || html.length);
      const aM = block.match(/href=["'][^"']*?\/detail\/(\d+)/i);
      if (!aM || seen[aM[1]]) continue;
      const vid = aM[1];

      const tM = block.match(/hg-drama-card__title[^>]*>([\s\S]*?)<\/(?:a|div|span|h\d+)>/i) ||
                 block.match(/<a[^>]+href=["'][^"']*?\/detail\/\d+[^"']*["'][^>]*>([\s\S]*?)<\/a>/i);
      const title = tM ? txt(tM[1]) : ('短剧 ' + vid);

      const imgM = block.match(/data-src=["']([^"']+)["']/i) || block.match(/src=["']([^"']+)["']/i);
      const epM = block.match(/hg-drama-card__episode[^>]*>([\s\S]*?)<\/(?:span|div|i|p)>/i);
      const scM = block.match(/hg-drama-card__score[^>]*>([\s\S]*?)<\/(?:span|div|i|p)>/i);

      seen[vid] = true;
      list.push({
        id: vid,
        name: title,
        pic: cleanUrl(imgM ? imgM[1] : ''),
        ep: epM ? txt(epM[1]) : '',
        score: scM ? txt(scM[1]) : ''
      });
    }
  }

  // 2. 兜底扫描：若类名变更，直接抓取页面所有包含 /detail/数字 的超链接
  if (!list.length) {
    const linkRegex = /<a\s+[^>]*href=["']([^"']*?\/detail\/(\d+)[^"']*)["'][^>]*>([\s\S]*?)<\/a>/gi;
    while ((m = linkRegex.exec(html)) !== null) {
      const vid = m[2];
      if (seen[vid]) continue;
      seen[vid] = true;
      const inner = m[3];
      const title = txt(inner) || ('短剧 ' + vid);
      const imgM = inner.match(/src=["']([^"']+)["']/i) || html.slice(Math.max(0, m.index - 300), m.index).match(/src=["']([^"']+)["']/i);
      list.push({
        id: vid,
        name: title,
        pic: cleanUrl(imgM ? imgM[1] : ''),
        ep: '',
        score: ''
      });
    }
  }

  return list;
}

// 排行榜解析
function parseRanks(html){
  const list = [], seen = {};
  const reItem = /<(?:div|a|li)\s+[^>]*class="[^"]*\bhg-rank-item\b[^"]*"[^>]*>/gi;
  const starts = [];
  let m;
  while ((m = reItem.exec(html)) !== null) starts.push(m.index);

  for (let i = 0; i < starts.length; i++) {
    const block = html.slice(starts[i], starts[i + 1] || html.length);
    const aM = block.match(/href=["'][^"']*?\/detail\/(\d+)/i);
    if (!aM || seen[aM[1]]) continue;
    const vid = aM[1];
    seen[vid] = true;

    const tM = block.match(/hg-rank-item__title[^>]*>([\s\S]*?)<\/(?:h\d+|a|div|span)>/i) ||
               block.match(/<a[^>]+href=["'][^"']*?\/detail\/\d+[^"']*["'][^>]*>([\s\S]*?)<\/a>/i);
    const imgM = block.match(/data-src=["']([^"']+)["']/i) || block.match(/src=["']([^"']+)["']/i);
    const tagM = block.match(/hg-rank-item__tags[^>]*>([\s\S]*?)<\/div>/i);

    list.push({
      id: vid,
      name: tM ? txt(tM[1]) : ('短剧 ' + vid),
      pic: cleanUrl(imgM ? imgM[1] : ''),
      remarks: tagM ? txt(tagM[1]) : ''
    });
  }
  return list;
}

// 封面 AES 图片解密
function decrypt(ab){
  const u = new Uint8Array(ab);
  const plain = (u[0] === 255 && u[1] === 216) || (u[0] === 137 && u[1] === 80) || (u[0] === 82 && u[1] === 73);
  if (plain || u.length % 16 !== 0) return new Blob([ab]);
  try {
    const w = [];
    for (let i = 0; i < u.length; i += 4) {
      w.push((u[i] << 24) | ((u[i+1] || 0) << 16) | ((u[i+2] || 0) << 8) | (u[i+3] || 0));
    }
    let h = CryptoJS.enc.Hex.stringify(CryptoJS.AES.decrypt(
      { ciphertext: CryptoJS.lib.WordArray.create(w, u.length) },
      KEY,
      { iv: IV, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.NoPadding }
    )).toLowerCase();
    if (!h.startsWith('ffd8')) return new Blob([ab]);
    const end = h.lastIndexOf('ffd9');
    if (end >= 0) h = h.slice(0, end + 4);
    const o = new Uint8Array(h.length / 2);
    for (let i = 0; i < o.length; i++) o[i] = parseInt(h.slice(i * 2, i * 2 + 2), 16);
    return new Blob([o], { type: 'image/jpeg' });
  } catch (e) {
    return new Blob([ab]);
  }
}

async function loadPic(imgEl, u){
  if (!u) return;
  if (cache.has(u)) { imgEl.src = cache.get(u); return; }
  try {
    const res = await fetch(px(u));
    const blob = decrypt(await res.arrayBuffer());
    const objUrl = URL.createObjectURL(blob);
    cache.set(u, objUrl);
    imgEl.src = objUrl;
  } catch (e) {
    imgEl.src = px(u);
  }
}

function renderGrid(items){
  const r = $('list');
  r.innerHTML = '';
  const g = document.createElement('div');
  g.className = 'grid';
  items.forEach(x => {
    const c = document.createElement('div');
    c.className = 'card';
    c.onclick = () => go(x.id, 1);
    const cv = document.createElement('div');
    cv.className = 'cover';
    const im = document.createElement('img');
    loadPic(im, x.pic);
    cv.append(im);
    if (x.ep) cv.insertAdjacentHTML('beforeend', `<span class="badge ep">${x.ep}</span>`);
    if (x.score) cv.insertAdjacentHTML('beforeend', `<span class="badge score">${x.score}</span>`);
    c.append(cv);
    c.insertAdjacentHTML('beforeend', `<div class="info"><div class="name">${x.name}</div></div>`);
    g.append(c);
  });
  r.append(g);
}

function renderRank(items){
  const r = $('list');
  r.innerHTML = '';
  items.forEach((x, i) => {
    const e = document.createElement('div');
    e.className = 'rank';
    e.onclick = () => go(x.id, 1);
    const im = document.createElement('img');
    loadPic(im, x.pic);
    e.innerHTML = `<div class="rankno">${i + 1}</div>`;
    e.append(im);
    e.insertAdjacentHTML('beforeend', `<div class="rankmeta"><div class="rankname">${x.name}</div><div class="ranktags">${x.remarks}</div></div>`);
    r.append(e);
  });
}

function renderPages(show){
  const r = $('pages');
  if (!show) { r.style.display = 'none'; return; }
  r.style.display = 'flex';
  r.innerHTML = `<button class="pagebtn" ${pg <= 1 ? 'disabled' : ''} onclick="changePg(-1)">◀ 上一页</button>`;
  for (let n = Math.max(1, pg - 2); n < Math.max(1, pg - 2) + 5; n++) {
    r.innerHTML += `<button class="pagebtn pnum ${n === pg ? 'active' : ''}" onclick="loadList(category, ${n})">${n}</button>`;
  }
  r.innerHTML += `<button class="pagebtn" onclick="changePg(1)">下一页 ▶</button>`;
}

async function loadList(c, p = 1){
  category = c;
  pg = p;
  $('list').innerHTML = `<div class="loading">正在获取数据中 (第 ${p} 页)...</div>`;
  renderPages(false);
  try {
    const targetUrl = getPath(c, p);
    const html = await proxyFetch(targetUrl);
    const items = c.includes('rank') ? parseRanks(html) : parseCards(html);
    if (!items || !items.length) {
      $('list').innerHTML = `<div class="error">当前未匹配到短剧列表数据。<br><small style="color:var(--dim)">请点击右上角 ⚙ 尝试切换到其他线路节点。</small></div>`;
      return;
    }
    c.includes('rank') ? renderRank(items) : renderGrid(items);
    renderPages(!c.includes('rank'));
  } catch (e) {
    $('list').innerHTML = `<div class="error">请求失败: ${e.message}<br><small style="color:var(--dim)">请检查网络或代理是否通畅</small></div>`;
  }
}

function changePg(d){
  if (pg + d > 0) {
    loadList(category, pg + d);
    scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function switchTab(c){
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.x === c));
  loadList(c, 1);
}

async function searchNow(){
  const q = $('search').value.trim();
  if (!q) return;
  $('list').innerHTML = `<div class="loading">正在搜索: ${q}...</div>`;
  renderPages(false);
  try {
    const searchUrl = SITE + '/search/video/' + encodeURIComponent(q) + '/';
    const html = await proxyFetch(searchUrl);
    const items = parseCards(html);
    items.length ? renderGrid(items) : ($('list').innerHTML = `<div class="loading">未找到“${q}”相关短剧</div>`);
  } catch (e) {
    $('list').innerHTML = `<div class="error">搜索失败: ${e.message}</div>`;
  }
}

// 路由与播放控制
function go(id, ep){ location.hash = `#/video/${id}/ep-${ep}`; }
function backHome(){ stopVideo(); location.hash = '#/'; }
window.addEventListener('hashchange', router);

async function router(){
  const m = location.hash.match(/#\/video\/([^/]+)\/ep-(\d+)/);
  if (!m) {
    $('play').classList.remove('active');$('home').classList.add('active');
    return;
  }
  $('home').classList.remove('active');$('play').classList.add('active');
  await openDrama(m[1], +m[2]);
}

async function openDrama(id, targetEp){
  dramaId = id;
  $('title').textContent = '正在加载剧集...';
  $('debug').textContent = '正在解析详情页...';
  try {
    const detailUrl = SITE + '/detail/' + id + '/';
    const html = await proxyFetch(detailUrl);
    const titleM = html.match(/class="[^"]*\bhg-web-detail__title\b[^"]*"[^>]*>([\s\S]*?)<\//i) || html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i);
    dramaTitle = titleM ? txt(titleM[1]) : '短剧播放';
    
    tracks = [];
    const gridM = html.match(/class="[^"]*\bhg-web-detail__ep-grid\b[^"]*"[^>]*>([\s\S]*?)<\/div>/i);
    if (gridM) {
      const are = /<a\b[^>]*>[\s\S]*?<\/a>/gi;
      let m;
      while ((m = are.exec(gridM[1])) !== null) {
        const tag = m[0];
        const hrefM = tag.match(/href=["']([^"']+)["']/i);
        const eidM = tag.match(/data-ep-id=["']([^"']*)["']/i);
        if (hrefM) {
          const ep = eidM ? eidM[1] : String(tracks.length + 1);
          tracks.push({ ep, name: `第${ep}集`, url: cleanUrl(hrefM[1]) });
        }
      }
    }
    if (!tracks.length) {
      const playM = html.match(/class="[^"]*\bhg-web-detail__play\b[^"]*"[^>]*href=["']([^"']+)["']/i);
      if (playM) tracks.push({ ep: '1', name: '第1集', url: cleanUrl(playM[1]) });
    }
    if (!tracks.length) throw new Error('未检索到可用集数');

    current = Math.max(0, tracks.findIndex(x => x.ep === String(targetEp)));
    $('navTitle').textContent = dramaTitle;
    renderEpsUI();
    await playTargetEp();
  } catch (e) {
    $('title').textContent = '加载失败: ' + e.message;
    $('debug').textContent = '❌ ' + e.message;
  }
}

function renderEpsUI(){
  const r = $('eps');
  r.innerHTML = '';
  tracks.forEach((x, i) => {
    const b = document.createElement('button');
    b.textContent = x.ep;
    b.className = i === current ? 'active' : '';
    b.onclick = () => go(dramaId, x.ep);
    r.append(b);
  });
  $('title').textContent = dramaTitle + ' ' + (tracks[current]?.name || '');
}

async function playTargetEp(){
  const t = tracks[current];
  if (!t) return;
  stopVideo();
  source = '';
  $('debug').textContent = `正在提取 ${t.name} 真实视频源...`;
  try {
    const html = await proxyFetch(t.url);
    const m = html.match(/id="videoInitialData"[^>]*>([\s\S]*?)<\/script>/i);
    if (!m) throw new Error('播放页缺少 videoInitialData 数据');
    const data = JSON.parse(m[1]);
    const srcs = data.epPlaySrcs || {};
    let playUrl = String(srcs[t.ep] || data.videoSrc || '').replace(/\\u0026/g, '&').trim();
    if (!playUrl.startsWith('http')) {
      const uMatch = playUrl.match(/https?:\/\/[^\s"']+/);
      playUrl = uMatch ? uMatch[0] : '';
    }
    if (!playUrl) throw new Error('未能从页面解析出有效直链');
    source = playUrl;
    $('debug').textContent = '✅ 已成功解析出直链源';
    setRoute(/\.(m3u8|mp4)(?:$|[?#])/i.test(source) ? 0 : 1);
  } catch (e) {
    $('debug').textContent = '❌ ' + e.message;
  }
}

function setRoute(i){
  route = i;
  document.querySelectorAll('.route').forEach((x, idx) => x.classList.toggle('active', idx === i));
  if (source) startPlay();
}

function startPlay(){
  stopVideo();
  const v = $('video'), f =$('frame');
  const isDirect = /\.(m3u8|mp4)(?:$|[?#])/i.test(source);
  if (route === 0 && isDirect) {
    v.style.display = 'block';
    if (/\.m3u8(?:$|[?#])/i.test(source) && Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(source);
      hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
      hls.on(Hls.Events.ERROR, (_, d) => {
        if (d.fatal) $('debug').textContent = '⚠️ HLS 直链网络受阻，请尝试上方切换【公共解析】线路。';
      });
    } else {
      v.src = source;
      v.addEventListener('loadedmetadata', () => v.play().catch(() => {}), { once: true });
    }
  } else {
    f.style.display = 'block';
    f.src = PARSER + encodeURIComponent(source);
  }
}

function stopVideo(){
  if (hls) { hls.destroy(); hls = null; }
  const v = $('video'), f =$('frame');
  v.pause();
  v.removeAttribute('src');
  v.load();
  f.src = '';
  v.style.display = 'none';
  f.style.display = 'none';
}

function step(d){
  const next = current + d;
  if (next >= 0 && next < tracks.length) go(dramaId, tracks[next].ep);
  else alert(d < 0 ? '已经是第一集' : '已经是最后一集');
}

function fullScreen(){
  const p = $('player');
  const on = p.classList.toggle('webfull');
  $('fullText').textContent = on ? '× 退出全屏' : '⛶ 网页全屏';
  document.body.style.overflow = on ? 'hidden' : '';
}

// 模态框与设置控制
function openSettings(){
  $('proxy').value = PROXY;
  $('site').value = SITE;
  $('parser').value = PARSER;
  $('setting').classList.add('show');
}
function closeModal(id){ $(id).classList.remove('show'); }
function applyNode(url){ $('site').value = url; }
function saveSettings(){
  SITE = ($('site').value.trim() \vert{}\vert{} DEF_SITE).replace(/\/+$/, '');
  PROXY = $('proxy').value.trim();
  PARSER = $('parser').value.trim() || DEF_PARSER;
  localStorage.setItem('hg_site', SITE);
  localStorage.setItem('hg_proxy', PROXY);
  localStorage.setItem('hg_parser', PARSER);
  cache.clear();
  closeModal('setting');
  loadList(category, pg);
}

window.addEventListener('DOMContentLoaded', () => {
  if (location.hash.startsWith('#/video/')) router();
  else loadList('home', 1);
});
