<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄果短剧 - 直连播放版</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 20px; background: #f0f2f5; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .search-box { display: flex; gap: 10px; }
        .search-box input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        .search-box button { padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; transition: 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card-img { height: 260px; background: #e9ecef; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 12px; color: #666; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 12px; }
        .card-title { font-size: 14px; font-weight: bold; margin: 0 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-remarks { font-size: 12px; color: #666; }

        #player-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .close-btn { position: absolute; top: 20px; right: 30px; color: white; font-size: 30px; cursor: pointer; }
        #video-container { width: 90%; max-width: 900px; background: black; }
        video { width: 100%; max-height: 65vh; outline: none; }
        
        .ep-list { margin-top: 20px; width: 90%; max-width: 900px; display: flex; flex-wrap: wrap; gap: 8px; max-height: 20vh; overflow-y: auto; padding-bottom: 20px;}
        .ep-btn { padding: 6px 10px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .ep-btn.active { background: #007bff; border-color: #007bff; }
        
        #loading { display: none; text-align: center; padding: 20px; color: #007bff; font-weight: bold; }
        .debug-box { background: #ffebee; color: #c62828; padding: 15px; border-radius: 5px; grid-column: 1/-1; }
        .debug-box textarea { width: 100%; height: 150px; margin-top: 10px; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>黄果短剧 (本地直连版)</h2>
        <div style="color: red; font-size: 12px; margin-right: auto; margin-left: 15px;">* 必须开启浏览器 Allow CORS 插件</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="输入剧名..." onkeydown="if(event.keyCode==13) doSearch()">
            <button onclick="doSearch()">搜索</button>
        </div>
    </div>
    
    <div id="loading">正在直接请求目标网站，请稍候...</div>
    <div class="grid" id="videoGrid"></div>
</div>

<div id="player-modal">
    <div class="close-btn" onclick="closePlayer()">&times;</div>
    <div id="video-container">
        <video id="videoPlayer" controls playsinline></video>
    </div>
    <div class="ep-list" id="epList"></div>
</div>

<script>
    const SITE = 'https://huangguoai.com';
    let hls = null;
    
    // 直接 Fetch，不使用代理，依赖浏览器的 CORS 插件
    async function fetchHtml(url) {
        try {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('videoGrid').innerHTML = '';
            
            const res = await fetch(url);
            const text = await res.text();
            
            document.getElementById('loading').style.display = 'none';
            return text;
        } catch (e) {
            console.error(e);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('videoGrid').innerHTML = `
                <div class="debug-box">
                    <strong>请求直接失败 (Fetch Error)</strong><br>
                    请检查：是否安装并开启了 <b>Allow CORS</b> 浏览器插件？如果没开启，浏览器会拦截请求。
                </div>`;
            return '';
        }
    }

    function parseGridCards(html) {
        if (!html) return [];
        const list = [];
        const seen = {};
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        
        // 抓取逻辑
        const cards = doc.querySelectorAll('.hg-drama-card');
        cards.forEach(card => {
            const aTag = card.querySelector('a[href*="/detail/"]');
            if (!aTag) return;
            
            const href = aTag.getAttribute('href');
            const vidMatch = href.match(/\/detail\/(\d+)/);
            if (!vidMatch) return;
            const vid = vidMatch[1];
            
            if (seen[vid]) return; 
            seen[vid] = true;
            
            const titleTag = card.querySelector('.hg-drama-card__title');
            const title = titleTag ? titleTag.textContent.trim() : '未知剧名';
            
            const imgTag = card.querySelector('[data-src], img');
            const pic = imgTag ? (imgTag.getAttribute('data-src') || imgTag.getAttribute('src')) : '';
            
            const epTag = card.querySelector('.hg-drama-card__episode');
            const remarks = epTag ? epTag.textContent.trim() : '';
            
            list.push({ vod_id: vid, vod_name: title, vod_pic: pic, vod_remarks: remarks });
        });
        
        return list;
    }

    async function loadHome() {
        const html = await fetchHtml(SITE + '/');
        if(!html) return;
        const list = parseGridCards(html);
        renderGrid(list, html);
    }

    async function doSearch() {
        const kw = document.getElementById('searchInput').value.trim();
        if (!kw) return loadHome();
        const html = await fetchHtml(SITE + '/search/video/' + encodeURIComponent(kw) + '/');
        if(!html) return;
        const list = parseGridCards(html);
        renderGrid(list, html);
    }

    function renderGrid(list, rawHtml) {
        const grid = document.getElementById('videoGrid');
        grid.innerHTML = ''; 
        
        // 如果抓到了 HTML，但没解析出数据，输出服务器返回的真实内容（用于排查 Cloudflare）
        if(list.length === 0) {
            const preview = rawHtml.substring(0, 1000).replace(/</g, '&lt;').replace(/>/g, '&gt;');
            grid.innerHTML = `
                <div class="debug-box">
                    <strong>成功连上服务器，但未能解析到视频列表！</strong><br>
                    原因可能是网站改版，或者遇到了反爬虫验证。以下是网站实际返回的源码：<br>
                    <textarea readonly>${preview}</textarea>
                </div>`;
            return;
        }
        
        list.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            let picUrl = item.vod_pic;
            if(picUrl && !picUrl.startsWith('http')) picUrl = SITE + picUrl;
            
            card.innerHTML = `
                <div class="card-img">
                    <img src="${picUrl}" alt="${item.vod_name}" onerror="this.style.display='none'; this.parentNode.innerHTML='图片加密/防盗链'" />
                </div>
                <div class="card-info">
                    <h3 class="card-title" title="${item.vod_name}">${item.vod_name}</h3>
                    <div class="card-remarks">${item.vod_remarks}</div>
                </div>
            `;
            card.onclick = () => openDetail(item.vod_id);
            grid.appendChild(card);
        });
    }

    async function openDetail(id) {
        document.getElementById('loading').style.display = 'block';
        const html = await fetchHtml(SITE + '/detail/' + id + '/');
        document.getElementById('loading').style.display = 'none';
        if (!html) return;
        
        const tracks = [];
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        
        const epLinks = doc.querySelectorAll('.hg-web-detail__ep-grid a');
        epLinks.forEach(a => {
            const href = a.getAttribute('href');
            const eid = a.getAttribute('data-ep-id');
            const name = eid ? '第' + eid + '集' : a.textContent.trim();
            if (href) tracks.push({ name: name, url: SITE + href, ep: eid || '1' });
        });
        
        if (tracks.length > 0) {
            showPlayer(tracks);
            playEpisode(tracks[0].url, tracks[0].ep, 0); 
        } else {
            alert('未找到播放列表，可能需要登录或解析失败。');
        }
    }

    function showPlayer(tracks) {
        const modal = document.getElementById('player-modal');
        const epList = document.getElementById('epList');
        epList.innerHTML = '';
        
        tracks.forEach((track, index) => {
            const btn = document.createElement('button');
            btn.className = 'ep-btn';
            btn.id = 'ep-btn-' + index;
            btn.innerText = track.name;
            btn.onclick = () => playEpisode(track.url, track.ep, index);
            epList.appendChild(btn);
        });
        
        modal.style.display = 'flex';
    }

    async function playEpisode(pageUrl, ep, index) {
        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('ep-btn-' + index).classList.add('active');

        const html = await fetchHtml(pageUrl);
        if (!html) return;
        
        let playUrl = '';
        const m = html.match(/id="videoInitialData"[^>]*>([\s\S]*?)<\/script>/);
        if (m) {
            try {
                const data = JSON.parse(m[1]);
                const srcs = data.epPlaySrcs || {};
                playUrl = srcs[ep] || data.videoSrc || '';
                playUrl = playUrl.replace(/\\u0026/g, '&');
            } catch (e) {}
        }

        if (!playUrl) {
            alert('未能提取到直链 M3U8 地址！');
            return;
        }

        initHlsPlayer(playUrl);
    }

    function initHlsPlayer(url) {
        const video = document.getElementById('videoPlayer');
        if (hls) hls.destroy();
        
        if (Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) alert("视频加载失败，可能是防盗链拦截了当前域名。");
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.addEventListener('loadedmetadata', () => video.play());
        }
    }

    function closePlayer() {
        document.getElementById('player-modal').style.display = 'none';
        document.getElementById('videoPlayer').pause();
        if (hls) { hls.destroy(); hls = null; }
    }

    window.onload = loadHome;
</script>
</body>
</html>
